var BANKS={"B1":{"DAEUN_CLOSE":["그 전엔 없던 일이다. 맞제?","시즌이 바뀌면 사람이 바뀐다. 니도 그때부터 달라졌을 기라.","맞제? 안 맞으면 니 옆 사람 얘기다. 시즌은 집 전체를 흔든다."],"DAEUN_EVENT":{"비견":"어깨 견줄 사람이 나타났다. 동료든 경쟁자든 동업자든. 혼자 하던 일에 사람이 붙었거나 니 자리에 누가 들어왔거나.","겁재":"돈이 나갔거나 누가 니 걸 가져갔다. 믿었던 사람한테 뺏겼거나 나눠 가질 일이 생겼거나. 평소 안 하던 승부도 걸었을 기라.","식신":"만들고 먹고 노는 쪽으로 판이 바뀌었다. 살이 붙었거나 새로 배우기 시작했거나, 아나 아랫사람 일이 커졌거나.","상관":"말이 많아지고 반항심이 올라왔다. 윗사람하고 부딪쳤거나, 하던 일 때려치우고 싶었거나, 새로 하고 싶은 말이 생겼거나.","편재":"큰돈이 움직였다. 들어왔든 나갔든. 투자, 사업, 이사, 큰 거래. 판이 커졌제.","정재":"꼬박꼬박 들어오는 게 생겼다. 취직, 안정, 살림 자리 잡기. 대신 답답해졌고.","편관":"어깨가 무거워졌다. 책임이 갑자기 늘었거나 윗사람이 바뀌었거나, 아프거나 눌리는 일. 빡센 시즌이다.","정관":"자리가 생겼다. 소속, 직함, 이름. 울타리 안으로 들어갔다. 대신 니 맘대로는 못 하게 됐고.","편인":"혼자 파고드는 시간이 늘었다. 엉뚱한 공부, 특이한 사람, 종교나 역술 같은 거. 별난 시즌이다.","정인":"받쳐 주는 게 생겼다. 도와주는 사람, 자격, 문서, 엄마 쪽 일. 혼자 버티던 게 밑에서 받쳐지기 시작했다."},"DAEUN_FRAME":["**{year}년에 10년 시즌이 바뀌었다.** {expl}","하나 더. **{year}년.** 니 10년 시즌이 넘어갔다. 시즌은 팔자가 10년마다 갈아입는 옷이다. {expl}"],"EL_ADJ":{"목":"일을 자꾸 새로 벌이는","화":"일단 드러내고 보는","토":"한번 쥔 걸 안 놓는","금":"맞다 틀리다를 끝까지 가리는","수":"생각이 많아 결정을 미루는"},"EL_COP":{"목":"다","화":"이다","토":"이다","금":"다","수":"이다"},"EL_MEAN":{"목":{"name":"나무(木)","mean":"나무는 위로 뻗는 기운이다. 새로 시작하고 키우고 계획 세우는 쪽.","habit":"일을 자꾸 새로 벌이는 거"},"화":{"name":"불(火)","mean":"불은 드러내는 기운이다. 말하고 보여 주고 사람 앞에 서는 쪽.","habit":"일단 드러내고 보는 거"},"토":{"name":"흙(土)","mean":"흙은 붙드는 기운이다. 쌓고 지키고 사이에서 중재하는 쪽.","habit":"한번 쥔 걸 안 놓는 거"},"금":{"name":"쇠(金)","mean":"쇠는 자르는 기운이다. 따지고 정리하고 선 긋는 쪽.","habit":"맞다 틀리다를 끝까지 가리는 거"},"수":{"name":"물(水)","mean":"물은 스며드는 기운이다. 궁리하고 알아보고 상황 따라 모양을 바꾸는 쪽.","habit":"생각이 많아서 결정을 미루는 거"}},"END":["그게 니 팔자다. 여기까지는 공짜다. 니가 와 그때 그랬는지, 앞으로 어떤 손님이 오는지, 돈은 어디로 흐르는지. 나머지는 앉아서 들어라.","여기까지가 {화자}가 공짜로 봐 주는 거다. 나머지는 돈 받고 본다. 열여섯 편 중 열다섯 편, 니 얘기만 골라서."],"END2":{"q":"여기까지가 공짜다. 니가 물은 거, **{label}** 그 답은 바로 다음 장에 결론부터 있다. 나머지도 니 얘기만 골라서 한다.","none":"여기까지가 공짜다. 나머지는 니 얘기만 골라서 한다. 올해하고 내년, 바로 다음 장부터 간다."},"FORMULA":{"both":"니 팔자 {tot} 글자 중에 {n} 자가 {name}{cop}. 그런데 {mname}은 한 자도 없다. 한마디로 니는 **{adj} 사람인데, {madj} 사람**이다. 니 인생이 늘 같은 데서 막히는 게 그래서다.","many":"니 팔자 {tot} 글자 중에 {n} 자가 {name}{cop}. 한마디로 니는 **{adj} 사람**이다. 잘될 때도 이걸로 되고, 탈 날 때도 이것 때문이다.","miss":"니 팔자엔 {mname}이 한 자도 없다. 한마디로 니는 **{madj} 사람**이다. 니 인생이 늘 같은 데서 막히는 게 그래서다.","none":"니 팔자엔 다섯 기운이 고르게 다 있다. 한마디로 니는 **어디 가도 적응하는 사람**이다. 대신 딱 한 군데 미치지 못해서 늘 어중간하다는 소리를 듣는다."},"JOB":{"식신":{"guess":"니, 뭘 만들어서 내놓는 일 하제? 요리든 물건이든 글이든, 손으로 모양을 만드는 쪽.","why":"와 아냐고? 니 팔자에 **손에서 뭐가 나오는 기운**이 간판으로 떠 있거든. 빵이든 글이든 영상이든, 눈에 보이는 걸 만들어 내놓는 재주다.","jobs":"요리, 제조, 공예, 콘텐츠 만드는 일, 손님 받는 일. 이런 데서 편했을 기라.","src":"kmZdzxsC_ZU"},"상관":{"guess":"니, 말로 먹고사는 일 하제? 기획이든 강의든 영업이든, 입이 밥벌이인 쪽.","why":"와 아냐고? 니 팔자에 **말로 사람을 움직이는 기운**이 간판으로 떠 있거든. 손에 잡히는 건 없는데 듣는 사람 마음이 바뀐다. 말, 글, 아이디어.","jobs":"기획, 마케팅, 강의, 방송, 영업, 창작. 시키는 대로만 하는 자리에선 숨 막혔을 기라.","src":"3ogDqj7GAA4"},"편재":{"guess":"니, 돈 굴리는 일 하제? 장사든 영업이든 투자든, 판 벌여서 돌리는 쪽.","why":"와 아냐고? 니 팔자에 **통 큰 돈 기운**이 간판으로 떠 있거든. 만 원 아끼려고 한 정거장 걸어가면서 천만 원짜리 계약엔 그 자리서 도장 찍는 기운이다.","jobs":"사업, 유통, 영업, 부동산, 투자. 정해진 월급 받는 자리는 답답했을 기라.","src":"lg8dRHOk6uc"},"정재":{"guess":"니, 꼬박꼬박 버는 일 하제? 월급이든 단골 장사든, 시계 보면서 성실하게 쌓는 쪽.","why":"와 아냐고? 니 팔자에 **꼬박꼬박 버는 기운**이 간판으로 떠 있거든. 달력에 월급날 동그라미 쳐 놓고 적금 자동이체 몇 개씩 걸어 둔 사람 기운이다.","jobs":"회계, 관리, 안정된 직장, 전문 기술, 꾸준한 장사. 한탕은 니 체질 아이다.","src":"M1sNyFw_rd0"},"편관":{"guess":"니, 빡센 일 하제? 현장이든 책임 자리든, 남들 힘들어서 안 하는 쪽.","why":"와 아냐고? 니 팔자에 **니를 몰아붙이는 기운**이 간판으로 떠 있거든. 마감 박아 놓고 매일 어데까지 했노 묻는 상사 같은 힘. 그게 니를 키운다.","jobs":"군인, 경찰, 현장 관리, 응급, 영업 최전선, 감독. 편한 자리 가면 오히려 병난다.","src":"OmhI56LBA5k"},"정관":{"guess":"니, 조직에서 자리 지키는 일 하제? 회사든 관공서든, 울타리 안에서 인정받는 쪽.","why":"와 아냐고? 니 팔자에 **소속 기운**이 간판으로 떠 있거든. 명함에 회사 이름 박혀 있어야 마음 놓이는 사람이다. 니는 울타리가 있어야 산다.","jobs":"공무원, 대기업, 관리직, 법, 품질, 행정. 혼자 판 벌이는 건 니한테 안 맞는다.","src":"5CIzqiHxzow"},"편인":{"guess":"니, 남들 안 하는 걸 파는 일 하제? 특수 기술이든 종교든 예술이든, 좀 별난 쪽.","why":"와 아냐고? 니 팔자에 **옆길로 배운 기운**이 간판으로 떠 있거든. 학원 안 다니고 혼자 파서 남보다 잘하게 된 재주. 정해진 길 말고 니 식으로 익힌 기라.","jobs":"특수 기술, 연구, 예술, 상담, 종교, 역술. 짧게는 센데 길게는 끈기가 딸린다. 그거 알고 골라라.","src":"J8L7hBJEsBo"},"정인":{"guess":"니, 배운 걸 남한테 넘기는 일 하제? 가르치거나 문서 다루거나 자격으로 먹고사는 쪽.","why":"와 아냐고? 니 팔자에 **배워서 넘기는 기운**이 간판으로 떠 있거든. 교과서대로 차근차근 가르치는 담임 선생 같은 기운. 배우고 정리해서 다음 사람한테 넘긴다.","jobs":"교사, 연구, 문서, 자격증 직종, 행정, 편집. 배움이 곧 밥이다.","src":"b0oHwvEf8xg"},"비견":{"guess":"니, 사람하고 어깨 부딪히는 일 하제? 팀이든 현장이든 동업이든, 혼자보다 여럿인 쪽.","why":"와 아냐고? 니 팔자에 **니랑 똑같은 놈 기운**이 간판으로 떠 있거든. 한 반에 니랑 같은 과목 잘하는 애가 있는 거랑 같다. 경쟁이고 동료다.","jobs":"팀장, 현장, 체육, 영업 조직, 동업. 혼자 방에서 하는 일은 금방 질린다.","src":"AsqB7aXMo3Q"},"겁재":{"guess":"니, 승부 붙는 일 하제? 평소엔 얌전한데 판만 벌어지면 사람이 달라지는 쪽.","why":"와 아냐고? 니 팔자에 **승부 기운**이 간판으로 떠 있거든. 평소엔 순한데 내기만 걸리면 눈빛이 바뀌는 사람. 니 안에 딴 놈이 산다.","jobs":"승부, 투자, 영업, 스포츠, 자영업. 남 밑에서 얌전히 있으면 그놈이 답답해한다.","src":"Y9SvHF2b0zk"}},"JOB_BACK":["아니라꼬? 그라모 그 일이 하고 싶어서 근질근질했을 기라. 안 했으면 후회했고.","아이가? 그라모 지금 하는 일에서 그 부분만 유독 잘했을 기라. 남들이 니한테 그걸 시켰고.","아니면 말고. 근데 니 주변에 그런 일 하는 사람이 니한테 자꾸 물어봤을 기라."],"JOB_BACK_G":{"재성":"아니라꼬? 월급 받는 자리였어도 재테크며 부업 머리는 늘 돌아갔을 기라. 통장 쪼개 놓고 굴렸제.","관성":"아니라꼬? 그라모 일 밖에서도 늘 니가 총대 멨을 기라. 모임이든 집안이든 결국 니한테 맡겨졌제.","인성":"아니라꼬? 그라모 자격증이든 공부든 계속 붙들고 있었을 기라. 사 놓고 안 읽은 책이 몇 권이고.","식상":"아니라꼬? 그라모 일 말고 취미로라도 뭘 만들거나 떠들고 있었을 기라. 가만있으면 좀이 쑤시제.","비겁":"아니라꼬? 그라모 혼자 하는 일이라도 경쟁만 붙으면 눈빛이 달라졌을 기라. 지는 건 못 참제."},"JOB_FIT":{"employee":["정관","정재","정인","편관","비견"],"public":["정관","정인","정재","편관"],"self":["편재","정재","겁재","식신","상관","비견"],"freelance":["상관","식신","편인","편재"]},"JOB_FIT_NO":"근데 하는 일하고 간판이 다르다. 그래서 그 일 하면서도 마음 한쪽은 딴 데 가 있었을 기라. {back}","JOB_FIT_YES":"그 일이 니 몸에 맞는 기라. {desc}","JOB_GANPAN":"니 팔자 간판엔 **{gp}**이 떠 있다.","JOB_KNOWN":{"employee":"니, 회사 다닌다 캤제.","public":"니, 공무원이나 선생 쪽 일 한다 캤제.","self":"니, 장사한다 캤제.","freelance":"니, 프리랜서로 일감 받아 한다 캤제.","jobseeker":"니, 일 찾는 중이라 캤제.","student":"니, 아직 학생이라 캤제.","homemaker":"니, 살림한다 캤제.","retired":"니, 은퇴했다 캤제.","rest":"니, 지금 쉬는 중이라 캤제.","preretire":"니, 퇴직 준비한다 캤제."},"JOB_OTHER":"{desc} {back}","JOB_PERSONAL":"니 같으면 {jobs} 같은 이름으로도 나온다.","JOB_YOUNG":"{desc} 그래서 길을 고른다면 {jobs} 쪽이 편하다.","KNUM":{"1":"한","2":"두","3":"세","4":"네","5":"다섯","6":"여섯","7":"일곱","8":"여덟"},"MANY":"니 팔자 {tot} 글자 중에 {n} 자가 {name}이다. {mean} 한 가지가 {n} 자면 그게 니 **타고난 기본값**이다. 잘될 때도 그걸로 되고 탈 날 때도 그것 때문이다. 니 같으면 {habit}, 그게 밥이자 병이다.","MISSING":{"목":"근데 **나무(木)가 없다.** 시작하는 기운, 뻗어 나가는 기운이 없단 말이다. 그래서 니는 시작에 집착한다. 새로 벌이고 싶어 안달인데 정작 첫발이 무겁다.","화":"근데 **불(火)이 없다.** 드러내는 기운, 표현하는 기운이 없다. 그래서 니는 오히려 튀고 싶어 한다. 없는 놈이 더 집착하는 법이다.","토":"근데 **흙(土)이 없다.** 중심 잡는 기운이 없다. 그래서 니는 안정에 집착한다. 자리 잡고 싶은데 자꾸 뜬다.","금":"근데 **쇠(金)가 없다.** 자르는 기운이 없단 말이다. 남이 니를 못 자르는데, 니도 니를 못 자른다. 끊을 때 못 끊는 거, 그거다.","수":"근데 **물(水)이 없다.** 흐르는 기운, 궁리하는 기운이 없다. 그래서 니는 배우는 데 집착한다. 공부에 목마른데 정작 유연한 게 약하다."},"MISSING_CLOSE":["없는 게 흠이 아이다. 팔자에 없는 건 복이다. 그 얘기는 뒤에서 한다.","없다고 채우려 들지 마라. 없는 걸 좇으면 있는 것까지 흔들린다. 그건 뒤에서."],"MISSING_NONE":"그라고 다섯 기운이 다 있다. 없는 게 없으니 집착도 없다. 대신 딱히 목마른 것도 없어서 뭘 좇아야 할지 모를 때가 있다.","MISS_ADJ":{"목":"새로 시작하는 첫발이 늘 무거운","화":"속을 잘 못 드러내는","토":"자리를 못 잡고 자꾸 뜨는","금":"끊을 때 못 끊는","수":"생각을 유연하게 못 돌리는"},"OPEN":["앉아라. 니 팔자 보기 전에 두 개만 맞혀 보자.","앉아라. 팔자 펴기 전에 내가 먼저 두 마디 하꾸마.","앉아 봐라. 사주 보러 왔제? 보기 전에 내가 먼저 찍는다."],"ORD":["하나","둘","셋"],"SEUN_CLOSE":["해마다 오는 기운은 손님이다. 왔다 간다. 근데 그 손님이 뭘 두고 갔는지는 니가 안다.","아니라꼬? 그라모 그해 니 옆 사람한테 그 일이 있었다. 손님은 집에 오지, 니한테만 오는 게 아이다."],"SEUN_EVENT":{"chung":"**{year}년에 자리가 흔들렸제.** 이사, 일 바뀜, 이별, 뭔가 갈라진 일. 그해 손님이 니 집 기둥을 정면으로 들이받았다.","편관":"**{year}년에 눌렸제.** 책임, 압박, 윗사람, 몸 고생. 빡센 놈이 집에 들어온 해다.","겁재":"**{year}년에 돈이 새거나 누가 가져갔제.** 니 몫 가져가는 놈이 집에 온 해다.","상관":"**{year}년에 말로 사고 쳤거나 뭔가 때려치웠제.** 참던 게 터지는 해다.","식신":"**{year}년엔 먹고 만들고 노는 쪽으로 판이 갔제.** 살이 붙거나 새로 배운 게 있거나.","편재":"**{year}년에 돈이 크게 움직였제.** 들어왔든 나갔든 판이 커진 해다.","정재":"**{year}년엔 꼬박꼬박이 생겼제.** 자리 잡고 안정된 대신 답답했던 해다.","편인":"**{year}년엔 혼자 파고들었제.** 엉뚱한 공부, 특이한 인연.","정인":"**{year}년엔 누가 받쳐 줬제.** 도움, 문서, 자격이 들어온 해다.","정관":"**{year}년에 자리나 이름이 생겼제.** 울타리가 씌워진 해다.","비견":"**{year}년에 니 같은 놈이 붙었제.** 경쟁이든 동료든."},"STEM_IMG":{"0":"**큰 나무(甲)**다. 위로만 자란다. 굽힐 줄 몰라서 부러지면 부러지지 안 휜다.","1":"**화초, 덩굴(乙)**이다. 감고 올라간다. 기댈 데만 잘 고르면 어디까지든 올라가는 사람.","2":"**한낮의 해(丙)**다. 안 비추는 데가 없다. 눈에는 확 띄는데 꾸준한 게 약하다.","3":"**촛불(丁)**이다. 작게 오래 탄다. 예민한 게 아니라 눈치가 빠른 기라.","4":"**큰 산(戊)**이다. 안 움직인다. 믿음직한데 속을 안 보여 준다.","5":"**논밭(己)**이다. 뭐든 심으면 기른다. 실속파인데, 남 일에 니 땅을 다 내준다.","6":"**무쇠, 도끼(庚)**다. 자르는 사람이다. 결단은 빠른데 부드러운 맛이 없다.","7":"**보석, 바늘(辛)**이다. 꼼꼼하고 날카롭다. 다듬을수록 값 오르는데, 찔리면 아프다.","8":"**큰 바다(壬)**다. 다 받아 준다. 방향만 잡히면 억수로 커지는데, 방향 없으면 넓기만 하다.","9":"**이슬, 시냇물(癸)**이다. 스며든다. 작아 보여도 바위 뚫는 사람."},"TEASE_HEAD":"앞으로 니한테 벌어질 일, 맛보기로 세 개만 짚어 준다.","TEASE_LOVE":{"yes":"{ord}, 짝으로 보면 앞 5년 안에 **사람이 곁에 붙는 해가 있다.** 몇 년인지는 四편에 있다.","no":"{ord}, 짝으로 보면 앞 5년 안엔 사람이 저절로 붙는 해가 없다. 그라모 우째야 생기노? 그건 四편에 있다.","married_yes":"{ord}, 부부로 보면 앞 5년 안에 **둘 사이가 다시 붙는 해가 있다.** 몇 년인지는 四편에 있다.","married_no":"{ord}, 부부로 보면 앞 5년 안엔 크게 붙는 해도 갈리는 해도 없다. 그 사이 뭘 조심하면 되는지는 四편에 있다."},"TEASE_MONEY":"{ord}, 돈으로 보면 앞 5년 안에 **돈이 손에 들어오는 해가 {g} 번, 조심할 해가 {b} 번** 있다. 그게 몇 년인지는 三편에 있다.","TEASE_MONEY_B":"{ord}, 돈으로 보면 앞 5년 안엔 크게 들어오는 해는 없고 **조심할 해가 {b} 번** 있다. 그게 몇 년인지, 우째 막는지는 三편에 있다.","TEASE_MONEY_G":"{ord}, 돈으로 보면 앞 5년 안에 **돈이 손에 들어오는 해가 {g} 번** 있다. 크게 새는 해는 없다. 그게 몇 년인지는 三편에 있다.","TEASE_MONEY_NONE":"{ord}, 돈으로 보면 앞 5년 안엔 크게 들어오는 해도 크게 새는 해도 없다. 그라모 니 돈은 어디서 나오노? 그건 三편에 있다.","TEASE_PEAK":"{ord}, 니 커리어 정점 다섯 해 중에 **{k} 개가 아직 안 왔다.** 제일 가까운 건 {yy}년, {age}세 때다. 그해에 뭘 해야 하는지는 十二편에 있다.","TEASE_PEAK2":{"before":"{ord}, 니 커리어 정점 시즌은 **{a1}세부터 10년**이다. 아직 안 왔다. 그 안에서 제일 높은 해가 언제인지는 十二편에 있다.","in":"{ord}, 니 커리어 정점 시즌은 **바로 지금**이다. 그 안에서 제일 높은 해가 언제인지는 十二편에 있다.","after":"{ord}, 니 커리어는 이미 한 번 크게 피었다. 그라모 남은 것 중엔 언제 또 힘이 붙노? 그건 十二편에 있다."},"TEASE_PEAK_NONE":"{ord}, 니 커리어 정점 다섯 해는 다 지나갔다. 그라모 인자 뭘로 빛나노? 그건 十二편에 있다.","TEASE_WORK":"{ord}, 일로 보면 **올해는 {n0}고, 내년은 {n1}다.** 옮길지 남을지는 二편에서 딱 잘라 준다.","TEASE_WORK_SAME":"{ord}, 일로 보면 **올해도 내년도 {n0}다.** 이 흐름에서 옮길지 남을지는 二편에서 딱 잘라 준다."},"B2":{"ACT":{"비겁":"장 볼 때다. 결정 말고 재료 모아라.","식상":"불 올릴 때다. 벌이되 아직 상에 내지 마라.","재성":"**나아갈 때다.** 달려라. 대신 이 해엔 큰 거 사지 마라. 파는 해다.","관성":"거두고 정리할 때다. 자리 잡아라. 큰 거 사도 되는 해다.","인성":"쉬고 정돈할 때다. 머리가 맑은 해라 **집이든 큰 거든 사려면 이 해다.**"},"ACT2":{"비겁":"같이 하자는 말이 많은 해다. 큰 결정 말고 사람부터 가려라.","식상":"새로 해 보고 싶은 게 생기는 해다. 작게 시작해라.","재성":"돈이 움직이는 해다. 벌인 걸 거둬라. 대신 큰 거 사지는 마라.","관성":"책임이 느는 해다. 자리 지키고 정리해라.","인성":"배우고 서류 챙기는 해다. 큰 거 사려면 이 해가 낫다."},"ANS_ACT":{"close":{"재성":["접지 마라. 상에 내는 해다. .","BRANCH_HEAD":"니 팔자 아랫줄 넉 자를 보자. 윗줄이 생각이면 아랫줄은 **살림**이다. 실제로 사는 모양이 여기 있다.","BRANCH_MIX":"니 아랫줄은 세 가지가 고르게 섞였다. 시작하는 기운 {a}, 한창인 기운 {b}, 마무리하는 기운 {c}. 한쪽으로 안 쏠렸단 소리다. 상황 따라 딴 사람이 되는 기라. 일관성 없다 소리 듣는 이유고, 어디 가도 적응하는 힘이기도 하다.","BRANCH_MOST":{"생지":{"scene":"니는 **밖으로 나가는 쪽**이다. 모임에 가도 바로 안 앉는다. 문 앞에서 한 바퀴 둘러보고 누가 있나 본 다음에 자리를 고른다. 분위기 별로면 커피 핑계 대고 슬쩍 빠진다.","why":"니 아랫줄 넉 자 중 {n}자가 계절이 막 바뀌는 때 글자거든. 초봄, 초여름 같은 때. 이런 글자는 마음이 늘 다음 계절에 먼저 가 있다.","so":"그래서 **시작이 좋고 끝이 아쉽다.** 말하고 행동이 어긋난다는 소리 듣는 거, 마음이 먼저 앞질러 갔다 돌아와서 그렇다.","term":"한마디로 계속 움직여야 사는 사람이다."},"왕지":{"scene":"니는 **안 변하는 쪽**이다. 남이 뭐라 캐도 생각이 잘 안 바뀐다. 겉과 속이 같아서 숨기는 게 없다. 좋게 말하면 안 휘둘리고, 나쁘게 말하면 고집이다.","why":"니 아랫줄 넉 자 중 {n}자가 계절이 한창일 때 글자거든. 한여름, 한겨울 같은 때. 딴 게 안 섞인 순한 기운이다.","so":"그래서 **잘 안 바뀐다.** 좋을 땐 버티는 힘이고, 나쁠 땐 눌러앉는 힘이다.","term":"한마디로 사람 눈에 잘 띄는 사람이다."},"고지":{"scene":"니는 **되돌아보는 쪽**이다. 지난 일을 오래 붙잡는다. 큰일엔 통이 큰데 작은 일에 목숨 건다. 몇십만 원은 시원하게 긁으면서 배달비 삼천 원엔 앱 세 개를 비교하는 사람, 그게 니다.","why":"니 아랫줄 넉 자 중 {n}자가 계절이 끝나는 때 글자거든. 늦봄, 늦가을 같은 때. 지난 계절을 창고에 쟁여 두는 기운이다.","so":"그래서 **지난 걸 오래 붙잡고, 대신 마무리는 확실하다.** 옛날이 좋았다는 말, 니 입에서 자주 나올 기라.","term":"한마디로 혼자 파고들고 되새기는 사람이다."}},"BRANCH_OFF":"근데 이 성질은 **속에만 있다.** 남들 눈엔 잘 안 보이고 니 혼자 속으로 그렇다.","BRANCH_ON":"이 성질은 **밖으로 훤히 드러나 있다.** 남들도 니를 그래 본다.","BREAK_BLOCK":"막는 법은 이거다. {block}","BREAK_CUR":"지금 10년은 니 {gung_mean} 쪽하고 사이가 나쁘다. {kind_mean} 이건 **10년짜리다.** 이번 시즌 내내 그쪽이 흔들린다.","BREAK_CUR2":"그라고 지금 10년({y1}년부터 {y2}년까지)은 니 {seat} 쪽을 계속 흔든다. {kind_mean} 이번 10년 내내 {seat} 쪽은 크게 벌이지 말고 지켜라.","BREAK_INTRO":"잘되다가 무너지는 데는 이유가 있다. 니 팔자 안에 **서로 사이 나쁜 짝**이 있거든. 어려운 말 할 거 없다. 어디가 우째 흔들리는지만 보면 된다.","BREAK_INTRO2":"잘되다가 무너지는 사람은 늘 같은 데서 무너진다. 니 팔자 안에서 서로 부딪치는 두 판을 보면 니 이야기가 보인다.","BREAK_JAHYUNG_NOTE":"(같은 기운이 둘이면 전부 이래 보는 건 이 집 방식이다. 딴 집은 넷만 친다. 밝혀 두고 간다.)","BREAK_NATAL":"니 팔자엔 {a_mean} 쪽하고 {b_mean} 쪽이 사이가 나쁘다. {kind_mean} 이건 운에서 온 게 아니라 **팔자에 박혀 있는 거라 평생 간다.** 그래서 늘 같은 데서 넘어지는 기라.","BREAK_NATAL_NONE":"니 팔자는 안에서 서로 싸우는 게 없다. 깔끔하단 소리다. 그라모 니가 무너지는 건 니 탓이 아니라 **그해 들어온 손님 때문이다.** 그건 지나간다.","BREAK_NONE2":"니 팔자는 안에서 서로 싸우는 판이 없다. 그라모 니는 언제 무너지노? **밖에서 들어온 기운이 니 일 자리나 짝 자리를 들이받을 때다.** 니 탓이 아니라 그해 운 탓이니, 그해만 조심하면 된다.","BREAK_NONE_ITEM":{"월":"{yy}년(일이 흔들리는 해)","일":"{yy}년(집과 짝이 흔들리는 해)"},"BREAK_NONE_NONE":"앞 10년 안엔 그런 해도 크게 안 보인다. 무너질 일은 니가 무리할 때뿐이다.","BREAK_NONE_WHEN":"앞으로 그런 해는 {items}이다. 그해엔 새로 벌이지 말고 지키는 쪽으로 가라.","BREAK_STORY":"**{title}.** {scene} {flavor} 이건 운에서 온 게 아니라 팔자에 박힌 거라, 사는 동안 몇 번이고 되풀이된다.","BREAK_SYMPTOM":"무너지기 전에 신호가 온다. 세 가지다. 하나, 몸이 먼저 흔들린다. 둘, 자주 쓰는 물건이 자꾸 고장 난다. 셋, 사람 만나기 싫고 집에만 있게 된다. **이 셋 중 둘이 겹치면 멈춰라.** 밀어붙일 때가 아이다.","BREAK_WHEN":"앞으로 이게 터지기 쉬운 해는 **{yrs}년**이다. 그해엔 큰 결정을 미루고 {block_short}","BREAK_WHEN_NONE":"앞 10년 안엔 이게 크게 터질 해가 안 보인다. 대신 버릇은 남아 있으니 평소에 막아라.","BREAK_YEAR":"올해 {yy}년도 니 {gung_mean} 쪽을 건드린다. {kind_mean} 이건 **1년짜리다.** 지나가긴 하는데 지나가는 동안은 확실히 탈이다.","BREAK_YEAR2":"올해 {yy}년도 니 {seat} 쪽을 건드린다. {kind_mean} 올해만 넘기면 된다.","CHEON_SHORT":{"비견":"니 길을 니가 정하는 고집","겁재":"악바리 승부욕","식신":"여유와 풍류","상관":"밀어붙이는 힘","편재":"큰 스케일","정재":"거북이 같은 꾸준함","편관":"센 데서 버티는 힘","정관":"바른 생활","편인":"창작하는 끼","정인":"공부 체질"},"CLOSE2":["이게 니다. 좋고 나쁜 거 없다. 쓰임이 있을 뿐이다. 어디 쓰이는 놈인지는 뒤에서 한다.","팔자가 좋다 나쁘다, 그런 건 바보들 얘기다. 니가 뭐 하는 놈이냐, 그게 전부다."],"CLOSE4":"10년 시즌은 니 거고 올해는 손님이다. 손님한테 안방 내주지 마라. 니 시즌대로 살아라.","CLOSE5":"앞일은 잘 안 맞는다. 니가 알았으니까. 알면 고민하고 고민하면 바꾼다. 그래서 {화자}는 앞일은 손님 순서까지만 말한다. 그 손님 우째 대접할지는 니 몫이다.","CLOSE6":["돈은 좇으면 도망가고 자리 잡으면 온다. 니 돈은 {path}에서 온다. 거기서 벌어라.","니 돈 그릇은 이만하다. 그릇보다 많이 담으면 넘친다. 넘친 건 남한테 간다."],"CLOSE7":"되는 데 가서 열심히 하고 안 되는 데 가서 대충 해라. 거꾸로 살면 넘어지고 또 넘어진다.","CLOSE8":["궁합은 글자가 아니라 자리다. 니 짝 자리에 앉을 수 있는 사람인지, 그것만 봐라.","니 옆에 누가 있다는 게 덕이다. 옆집 ⟪짝⟫하고 비교하는 사람은 덕이 없는 사람이다."],"CLOSE9":"바닥을 쳐야 올라간다. 막다른 데 가야 살길이 열리는 기라. 니가 지금 막다른 데 있으면, 거기가 열리는 자리다.","DECADE":{"재성":{"plain":"돈하고 일이 크게 움직이는 10년이다","life":"벌이가 늘든 판이 커지든, 들어오고 나가는 돈의 크기가 달라진다. 이사, 일 바꾸기, 사업 같은 큰 움직임도 이때 많다.","so":"그래서 움직이는 쪽이 맞다. 옮기든 차리든 넓히든 이 10년 안에 하는 게 좋다."},"식상":{"plain":"하고 싶은 걸 꺼내서 해 보는 10년이다","life":"새 일, 새 기술, 부업, 하고 싶은 말이 생긴다. 대신 윗사람이나 조직 규칙하고 자주 부딪친다.","so":"그래서 작게 시작해서 키우는 쪽이 맞다. 처음부터 크게 걸면 덜 익은 채로 내놓게 된다."},"관성":{"plain":"책임이 무거워지고 자리가 굳는 10년이다","life":"직장이면 맡는 일과 직급이 늘고, 장사면 세금, 직원, 허가 같은 책임이 는다. 바쁘고 눌리는데 이름은 선다.","so":"그래서 새로 벌이기보다 지금 자리를 키우는 쪽이 이득이다. 옮기더라도 하던 일로 더 나은 자리로 가라."},"인성":{"plain":"배우고 실력을 쌓는 10년이다","life":"공부, 자격, 집, 계약 같은 서류 일이 많고 도와주는 사람이 생긴다. 대신 몸이 무겁고 실행이 늦다.","so":"그래서 달리기보다 실력과 자격을 쌓는 쪽이 맞다. 집 같은 큰 걸 사기엔 좋은 10년이다."},"비겁":{"plain":"사람이 몰리고 경쟁이 붙는 10년이다","life":"친구, 동료, 동업 얘기가 많아지고 돈이 사람 따라 나간다. 혼자 하던 걸 같이 하게 된다.","so":"그래서 큰 결정보다 니 편을 만들고 실력을 다지는 쪽이 맞다. 동업하고 보증은 피해라."}},"DECADE_PAST":{"재성":"돈하고 일이 크게 움직인 10년","식상":"하고 싶은 걸 꺼내서 해 본 10년","관성":"책임이 무거워지고 자리가 굳은 10년","인성":"배우고 실력을 쌓은 10년","비겁":"사람이 몰리고 경쟁이 붙은 10년"},"DECADE_RX":["이번 10년엔 이래 살아라","{y1}년부터 {y2}년까지는 {plain}. {so}"],"EL_D":{"목":"나무다","화":"불이다","토":"흙이다","금":"쇠다","수":"물이다"},"EL_I":{"목":"나무가","화":"불이","토":"흙이","금":"쇠가","수":"물이"},"EL_N":{"목":"나무","화":"불","토":"흙","금":"쇠","수":"물"},"FILL":{"비겁":["니 편을 만들어라","니 편이 없으니 사람을 만들어 둬야 된다. 모임 하나, 믿을 친구 하나를 정해서 꾸준히 챙겨라. 일은 혼자 다 하지 말고 나눠 맡겨라."],"식상":["니 생각을 밖으로 꺼내라","표현할 길이 없으니 길을 만들어야 된다. 글이든 말이든 일주일에 한 번 니 생각을 밖으로 꺼내라. 일기든 블로그든 모임 발표든 다 된다."],"재성":["돈이 니 손을 덜 거치게 해라","돈 그릇이 없으니 장치를 만들어야 된다. 월급날 자동이체, 돈 관리 맡길 사람, 가계부 앱. 돈이 니 손을 덜 거칠수록 남는다."],"관성":["니 규칙을 니가 정해라","울타리가 없으니 규칙을 만들어야 된다. 일어나는 시간, 마감, 약속을 니가 정해서 남한테 알려 둬라. 지킬 수밖에 없게."],"인성":["물어볼 사람을 정해라","받쳐 줄 데가 없으니 배울 데를 정해야 된다. 선생 하나, 선배 하나를 정해 놓고 막힐 때 묻는 버릇을 들여라. 도와준다 카면 됐다 카지 말고 받아라."]},"FITJ_FIX_HEAD":"더 잘 되려면 이래 해라.","FITJ_HARD_HEAD":"어려웠던 게 있었다면 이래서다.","FITJ_HEAD":{"biz":"니 지금 {job} 한다 캤제. 장사는 니 이름 걸고 하는 사업이다. 사업운이 있나부터 보자.","free":"니 지금 {job} 한다 캤제. 프리랜서도 니 이름 걸고 하는 사업이다. 사업운이 있나부터 보자.","salary":"니 지금 {job} 일 한다 캤제. 회사 체질이 맞나부터 보자."},"FITJ_LUCK":{"biz":"운으로 보면 가까이는 **{yy}년**이 사업에 힘이 붙는 해다. 그해는 {name}다. 그때 크게 움직이고, 그 전까지는 위에 말한 걸 고쳐 둬라.","salary":"운으로 보면 가까이는 **{yy}년**이 회사에서 힘이 붙는 해다. 그해는 {name}다. 그때 손 들고, 그 전까지는 위에 말한 걸 고쳐 둬라."},"FITJ_LUCK_NONE":{"biz":"운으로 보면 앞 5년 안엔 크게 밀어주는 해가 안 보인다. 운 기다리지 말고 위에 말한 걸 고쳐서 버티는 힘을 키워라.","salary":"운으로 보면 앞 5년 안엔 크게 밀어주는 해가 안 보인다. 자리 지키면서 위에 말한 걸 고쳐 둬라."},"FITJ_MONEY":{"순환":" 돈 모양도 좋다. 니가 만든 걸 돈으로 바꾸는 길이 뚫려 있다.","만들되못담음":" 대신 재주는 있는데 돈 담는 그릇이 약하다.","담되안만듦":" 대신 돈 그릇은 있는데 니 걸 내놓고 알리는 힘이 약하다.","둘다없음":" 대신 팔자엔 만드는 힘도 돈 그릇도 약하다. 운에서 들어올 때 벌어 둬야 된다."},"FITJ_OTHER":{"seek":{"jeong":"지금 일 찾는 중이라 캤제. 니는 정해진 길에서 크는 사람이라 **조직이나 자격 쪽으로 찾는 게 맞다.** 들어갈 데를 먼저 정하고 거기 맞춰 준비해라.","pyeon":"지금 일 찾는 중이라 캤제. 니는 니 판에서 크는 사람이라 **회사만 찾지 말고 작게라도 니 일을 해 봐라.** 그게 오히려 길이 된다.","mix":"지금 일 찾는 중이라 캤제. 니는 어디 가도 되는 사람이다. **조건 좋은 데 먼저 들어가고, 니 일은 옆에서 키워라.**"},"young":{"jeong":"지금 공부하는 중이면, 니는 자격이나 시험으로 길을 여는 사람이다. **딸 수 있는 건 일찍 따 둬라.**","pyeon":"지금 공부하는 중이면, 니는 시험보다 해 본 걸로 길을 여는 사람이다. **알바든 프로젝트든 일찍 부딪쳐 봐라.**","mix":"지금 공부하는 중이면, 니는 둘 다 되는 사람이다. **자격 하나, 해 본 일 하나**를 같이 챙겨라."},"home":{"jeong":"지금 살림하는 중이면, 다시 나갈 때 니는 **정해진 시간에 하는 일**이 맞다. 시간제, 자격 쓰는 일.","pyeon":"지금 살림하는 중이면, 니는 **집에서 니 이름으로 하는 일**이 맞다. 손재주든 말재주든 작게 팔아 봐라.","mix":"지금 살림하는 중이면, **배운 걸로 작게 시작해서** 되는 쪽으로 키워라."},"retired":{"jeong":"은퇴했다 캤제. 니는 **해 온 일을 가르치거나 봐주는 자리**가 맞다. 소일이라도 정해진 날 나가는 게 좋다.","pyeon":"은퇴했다 캤제. 니는 **하고 싶던 걸 니 식으로 해 볼 때**다. 큰돈 걸지 말고 작게.","mix":"은퇴했다 캤제. **해 온 일 반, 하고 싶던 일 반**으로 지내라."}},"FITJ_R":{"bigeop":["니 같은 기운이 많아서 번 돈이 사람 따라 나갔다. 동업, 외상, 아는 사람이라고 깎아 준 거.","돈 받는 규칙을 정해라. 선금, 계약서, 아는 사람도 정가. 동업은 하지 마라."],"nojae":["일은 많이 했는데 돈이 안 남았다. 싸게 받고, 돈 관리를 안 해서다.","가격부터 올려라. 들어온 돈은 그날 바로 딴 통장으로 떼고, 장부는 남한테 맡겨라."],"nosik":["일감이든 손님이든 끊기면 버틸 게 없었다. 니 걸 먼저 내놓고 알리는 힘이 약해서다.","니가 한 일을 보여 줄 데를 만들어라. 포트폴리오든 후기든 SNS든, 한 달에 한 번은 꼭 올려라."],"jeong":["들쭉날쭉한 수입이 제일 힘들었을 기라. 니는 고정이 있어야 마음이 놓이는 사람이거든.","매달 고정으로 들어오는 판을 하나 만들어라. 정기 계약, 단골, 월 단위 일감 같은 거."],"gwan":["일을 다 떠안고 거절을 못 해서 몸이 먼저 지쳤다.","받을 일하고 거절할 일을 기준으로 갈라라. 단가 낮은 일부터 끊어라."],"in":["준비만 하다 시작이 늦었다. 완벽해야 내놓는 버릇 때문이다.","반만 돼도 내놔라. 내놓고 고치는 게 니한테는 더 빠르다."],"none":["판은 맞는데 아직 알려지지 않아서 그렇다.","니 이름이 알려질 데를 하나 정해서 꾸준히 써라."],"s_pyeon":["회사가 답답했을 기라. 시키는 대로만 하는 게 니 체질이 아니거든.","회사 안에서 니가 정할 수 있는 일을 맡아라. 새 일, 기획, 혼자 책임지는 일."],"s_gwan":["책임은 늘어나는데 인정은 늦게 왔을 기라.","니가 한 일은 니 입으로 말하고 기록으로 남겨라. 말 안 하면 모른다."],"s_sik":["윗사람하고 부딪쳤을 기라. 니 생각이 분명해서 그렇다.","할 말은 하되 글로, 대안까지 붙여서 해라. 그라모 반발이 아니라 제안이 된다."],"s_bigeop":["동료하고 견주고 경쟁하느라 지쳤을 기라.","옆 사람 말고 작년의 니하고 견줘라. 니 편 하나는 꼭 만들어라."],"s_in":["기회가 왔는데 준비가 덜 됐다고 미뤘을 기라.","기회 오면 일단 손 들어라. 준비는 하면서 한다."],"s_nogwan":["어디에 속해 있어도 붕 뜬 느낌이었을 기라. 울타리 기운이 없어서 그렇다.","회사 말고 니 기준을 하나 세워라. 몇 년 안에 뭘 할지 적어 두면 덜 흔들린다."],"s_none":["크게 어긋난 건 없다. 운 따라 오르내린 거다.","좋은 해에 움직이고 나쁜 해엔 지켜라. 그것만 해도 남들보다 앞선다."]},"FITJ_SIDE":{"jeong":" 그라고 {job2}도 같이 한다 캤제. 니는 고정이 있어야 편한 사람이라, 본업은 지키고 그쪽은 정해진 시간에만 해라. 부업이 본업을 넘보면 둘 다 흔들린다.","pyeon":" 그라고 {job2}도 같이 한다 캤제. 니는 니 판 체질이라 그쪽이 니 진짜 길일 수 있다. 그쪽 벌이가 본업 반을 넘으면 그때가 옮겨 갈 때다.","mix":" 그라고 {job2}도 같이 한다 캤제. 둘 다 되는 사람이라 같이 가도 된다. 대신 시간하고 돈은 장부로 갈라 둬라."},"FITJ_VERDICT":{"biz":{"pyeon":"**니는 사업 체질이다.** 남 밑보다 니 판에서 크는 사람이라 지금 길이 맞다.","mix":"**니는 사업도 되고 조직도 되는 사람이다.** 지금 길이 틀린 건 아니다. 대신 혼자 다 하려 들면 지친다.","jeong":"**니는 원래 정해진 길에서 크는 사람이다.** 사업이 안 된다는 게 아니라, 판을 크게 벌이는 사업보다 고정 거래처, 단골, 정기 계약처럼 꼬박꼬박 들어오는 구조로 짜야 된다."},"salary":{"jeong":"**니는 회사 체질이다.** 조직 안에서 한 칸씩 올라가는 게 니 길이다.","mix":"**니는 회사도 되고 니 판도 되는 사람이다.** 지금은 회사에서 실력을 쌓고, 니 판은 옆에 작게 키워 둬라.","pyeon":"**니는 원래 니 판 체질이다.** 회사가 답답한 게 당연하다. 당장 나오란 소리는 아니고, 회사 다니면서 니 이름 걸 일을 옆에 하나 키워 둬라."}},"GENDER_WORD":{"f":{"⟪짝⟫":"남편","⟪관가족⟫":"남편"},"m":{"⟪짝⟫":"아내","⟪관가족⟫":"자식"}},"GIFT_ARRIVE":"그라고 **없는 {el} 기운이 운에서 오는 해**가 있다. {years}년이다. 없던 손님이 집에 오는 기라. 좋은 게 아니라 얼떨떨하다. 그해에 갑자기 {grp_mean} 일이 생기는데 니가 다룰 줄 모른다. 처방은 하나다. 그해엔 큰 결정 하지 마라. 적응만 해라.","GIFT_INTRO":"마지막이다. 없는 기운 얘기.","GIFT_INTRO2":"마지막이다. 니 팔자에 없는 거, 넘치는 거, 그라고 니한테 맞춘 처방.","GIFT_MISSING":"니 팔자엔 **{el}({elh}) 기운이 없다.** 니한텐 {grp_mean}이 없단 말이다. {life} 근데 이걸 흠으로 알지 마라. **팔자에 없는 건 복이다.** 없으니 안 잃고 안 매인다. 남들 그것 때문에 무너질 때 니는 안 무너진다.","GIFT_MISSING2":"니 팔자엔 **{elname} 기운이 없다.** 니한테 이건 {grp_mean}이 없다는 뜻이다. {life} 근데 없는 건 흠이 아니라 복이다. 없으니 그것 때문에 무너질 일도 없다.","GIFT_NOCHASE":"그라고 **없는 걸 좇지 마라.** 없는 걸 채우려 들면 있는 것까지 흔들린다. 있는 걸 키워라. 니 팔자에서 제일 많은 게 {most}({mosth}) {mn}자다. 그게 니 무기다. 없는 건 믿을 사람 하나하고 도구로 메워라. 동업 말고 맡기는 기라.","GIFT_NONE":"니 팔자엔 다섯 기운이 다 있다. 없는 게 없다. 그라모 처방은 반대다. **많은 게 또 오면 넘친다.** 니한테 제일 많은 {el}({elh})이 {n}개인데, 이게 운에서 또 오는 해가 {years}년이다. 그해엔 넘쳐서 딴 데까지 망가진다. 그해엔 덜어내라.","GIFT_NONE2":"니 팔자엔 다섯 기운이 다 있다. 없는 게 없으니 집착도 없다. 대신 조심할 건 넘치는 쪽이다. 니한테 제일 많은 건 {elname}, {n}개다.","GRP_LIFE":{"비겁":"그래서 니는 혼자 다 하려 들고, 친구가 적고, 시키는 걸 못 한다.","식상":"그래서 니는 만드는 것보다 말이 앞서고 표현에 목마르다.","재성":"그래서 니는 돈에 집착하고 돈 얘기에 예민하다.","관성":"그래서 니는 소속에 집착하고, 막상 들어가면 답답해한다.","인성":"그래서 니는 배움에 집착하고 받는 걸 못 한다."},"GRP_MEAN":{"비겁":"내 편이나 경쟁자","식상":"만들어 내놓는 힘","재성":"돈 굴리는 기운","관성":"자리나 울타리","인성":"받침이나 배움"},"HIDDEN_ITEM":"{yy}년엔 속에 숨은 {plain}이 나온다. {mean}.","HIDDEN_MEAN":{"비견":"고집이 세지고 혼자 하려 든다. 옆 사람하고 기 싸움 붙기 쉽다","겁재":"경쟁심이 올라온다. 돈을 나눠 쓰거나 빌려 달라는 사람이 생긴다","식신":"먹고 쉬고 놀고 싶어진다. 집에 사람이 모이고 손으로 뭘 만든다","상관":"참던 말이 터진다. 옆 사람한테 한마디 하고 싶어지는 해다. 말 한 번 삼켜라","편재":"큰돈이 눈에 들어온다. 판 벌이고 싶어지고 씀씀이가 커진다","정재":"살림하고 저축을 챙기게 된다. 집안 돈 계산이 꼼꼼해진다","편관":"압박이 들어온다. 옆 사람이나 일 때문에 몰리는 느낌이 든다","정관":"체면하고 자리를 챙기게 된다. 결혼이나 약속 같은 정식 얘기가 나오기 쉽다","편인":"혼자 있고 싶어진다. 생각이 많아지고 엉뚱한 공부에 빠진다","정인":"기대고 싶어진다. 누가 챙겨 주거나 집안 어른 도움이 들어온다"},"HIDDEN_NOTE":"니 짝 자리 속엔 겉으로 안 보이는 기운이 {k}개 숨어 있다. 평소엔 조용하다가 **그 기운이 들어오는 해에 밖으로 튀어나온다.** 니 속마음으로 나오기도 하고 옆 사람 얼굴로 나오기도 한다.","HIDDEN_YEAR":"앞으로 10년 중엔 이렇다. {items}","ILJI_GENDER":{"상관":{"f":"니 남편 쪽이 시끄럽다는 소리다.","m":"자식 얘기가 같이 걸린다."},"편재":{"f":"니 옆자리에 돈이 앉아 있다.","m":"니 아내가 그런 사람이다."},"정재":{"f":"니 옆자리가 살림 자리다.","m":"니 아내가 그런 사람이다."},"편관":{"f":"니 남편이 그런 사람이다.","m":"니 옆자리가 무겁다."},"정관":{"f":"니 남편이 그런 사람이다.","m":"니 옆자리가 반듯하다."}},"ILJI_STATUS":{"single":"니가 끌리는 사람이 대개 이쪽이다.","dating":"지금 만나는 그 사람이 이쪽이면 제자리에 앉은 기라.","reunion":"헤어진 그 사람이 이쪽이었으면, 못 잊는 게 그래서다.","divorced":"갈라선 그 사람이 이쪽이었을 기라. 다음 사람 볼 때도 이 자리부터 봐라.","unknown":"니 옆자리에 앉을 사람이 이쪽이다."},"ILJI_TEN":{"비견":"니 짝 자리엔 **친구 같은 사람**이 앉아 있다. 대등하고 어깨 견주고, 그래서 자주 부딪친다. 니를 떠받드는 사람은 니 짝이 아니다.","겁재":"니 짝 자리엔 **니 안의 또 다른 니 같은 사람**이 앉아 있다. 겉과 속이 다르고 니 걸 나눠 가진다. 돈 얘기가 자꾸 나오는 사이다.","식신":"니 짝 자리엔 **먹이고 챙기는 사람**이 앉아 있다. 편하고 넉넉하다. 대신 살 붙고 늘어진다. 편한 게 다는 아이다.","상관":"니 짝 자리엔 **말 많고 재주 많은 사람**이 앉아 있다. 재밌는데 니 자리를 흔든다.","편재":"니 짝 자리엔 **판 벌이는 사람**이 앉아 있다. 통 크고 잘 돌아다닌다. 짝이 돈 얘기를 몰고 온다.","정재":"니 짝 자리엔 **꼬박꼬박 챙기는 사람**이 앉아 있다. 성실하고 안정적이다. 답답해도 든든하다.","편관":"니 짝 자리엔 **센 사람**이 앉아 있다. 니를 누르고 밀어붙인다. 대신 이 사람 옆에서 니가 세진다.","정관":"니 짝 자리엔 **울타리 같은 사람**이 앉아 있다. 반듯하고 소속감 주는데, 니 맘대로는 못 한다. 답답한 게 아니라 잡아 주는 기라.","편인":"니 짝 자리엔 **엉뚱한 사람**이 앉아 있다. 특이하고 혼자 파고드는 사람. 니를 이해 못 하는 게 아니라 다르게 이해하는 기라. 끈기는 딸린다.","정인":"니 짝 자리엔 **엄마 같은 사람**이 앉아 있다. 받쳐 주고 챙겨 주고. 편한데 니가 어리광 부리게 된다. 받는 걸 당연하게 알면 잃는다."},"INDEOK":{"gwan_no_in":"인복 얘기 하나 하자. 니는 자리 기운은 있는데 받쳐 주는 기운이 없다. 그래서 조직에서도, ⟪관가족⟫한테서도 **받는 게 없다고 느낀다.** 맞제? 근데 돈 기운까지 있으면 니는 받는 사람이 아니라 주는 사람이다. 니 자리를 니가 먹여 살리는 기라. 그게 덕이다.","in_yes":"인복 얘기 하나 하자. 니는 받쳐 주는 기운이 있다. 엄마든 선배든 문서든, 누가 늘 밑에서 받쳐 준다. 근데 니는 그걸 당연하게 안다. 그래서 고마운 줄 모르고 **인복 없다고 징징댄다.** 받은 거부터 세어 봐라.","none":"인복 얘기 하나 하자. 인복 없다 카지 마라. 니 옆에 누가 있다는 게 덕이다. 덕은 받는 게 아니라 베푸는 기라. 맛집이 손님 찾아다니더나? 맛있으면 **알아서 줄 선다.**"},"JOB_AGE":{"old":"니 나이엔 새 이름 좇을 때가 아이다. 위 열둘 중에 **오래 이어져 온 이름**하고 지금 이름 쪽에서 골라라. 앞으로의 이름은 니 밑에 올 사람들 몫이다.","mid":"니 나이엔 **지금 이름** 쪽이 맞는다. 앞으로의 이름은 지금 일에 하나 얹는 식으로 가라. 갈아타는 게 아니라 얹는 기라.","young":"니 나이엔 지금 이름하고 앞으로의 이름을 같이 봐라. **아직 갈아타도 되는 나이다.**"},"JOB_AGE_SENIOR":"니 나이엔 새로 배워서 뛰어드는 것보다 **지금까지 한 일을 남한테 넘기는 자리**가 맞다. 가르치고, 봐주고, 관리하는 쪽. 위 이름들 중에 오래 이어져 온 쪽을 봐라.","JOB_CURRENT":"니 지금 {job} 한다 캤제.","JOB_G":{"식상":"뭘 만들어 내놓는 일이다. 니가 만든 게 남 손에 가야 밥이 된다. 시키는 것만 하는 자리에선 시든다.","재성":"굴리는 일이다. 사람, 돈, 물건을 돌려서 남기는 거. 정해진 월급만 받는 자리는 답답하다.","관성":"자리 지키는 일이다. 조직 안에서 책임지고 인정받는 거. 혼자 판 벌이면 무너진다.","인성":"배워서 넘기는 일이다. 문서, 자격, 가르치는 일. 몸 쓰는 일보다 머리 쓰는 일.","비겁":"사람하고 부대끼는 일이다. 팀, 현장, 동업. 혼자 방에서 하는 일은 금방 질린다."},"JOB_INTRO":"{화자}는 사주 볼 때 직업을 1번으로 친다. 팔자가 좋다 나쁘다는 의미 없다. 니가 뭐 하는 놈이냐, 그게 전부다. 니 간판은 **{plain} 기운**이다. {elname} 기운으로 먹고사는 사람이다.","JOB_LIST":"옛날 같으면 {trad}. 지금은 {now}. 앞으로는 {future}. 이래서 열둘이다.","JOB_NOW":"제일 중요한 건 이거다. **지금 하는 일하고 맞나.** 같은 운이 와도 하는 일 따라 좋고 나쁜 게 뒤집힌다. 니가 지금 {grp_plain} 쪽 일을 하고 있으면 운이 도와주고, 딴 일 하면서 이 생각만 하고 있으면 그게 병이다.","JOB_PICK":"이 중에 딱 하나만 짚으면 **{name}**이다. {one}. 안 해 봤으면 하고 싶어서 근질근질했을 거고, 해 봤으면 알 기라.","JOB_SANGGWAN":"말로 사람 움직이는 사람한테 하나 더. 남들이 잘 팔린다는 메뉴 말고 **니가 먹어도 맛있는 메뉴**를 팔아라. 니 재주는 니가 좋아하는 데서만 나온다.","KEEP":["니 무기를 써라","니 팔자에서 제일 센 건 {elname}이다. 없는 걸 채우려 애쓰는 것보다 이걸 쓰는 쪽이 백 배 낫다. 남들이 니한테 자꾸 맡기는 일, 그게 이 기운이 쓰이는 데다."],"KIND_FLAVOR":{"충":"이 둘은 한 번 터지면 크게 갈린다. 이사, 일 바뀜, 이별처럼 판이 통째로 바뀐다.","형":"이 둘은 잘하려고 밀어붙이다 탈이 난다. 되긴 되는데 몸이나 사람을 잃는다.","파해":"이 둘은 크게 안 터지고 속을 긁는다. 뒷말, 서운함이 쌓이다가 어느 날 한꺼번에 무너진다."},"KIND_MEAN":{"충":"**통째로 갈린다.** 이사, 일 바뀜, 이별, 갈라서는 일. 정면으로 들이받는 기운이라 자리가 바뀐다.","자형":"**제 힘에 제가 걸려 넘어진다.** 같은 기운이 둘이라 넘치는데, 넘친 게 밖이 아니라 니 발목으로 간다. 잘하려다 더 그르치는 그거다.","삼형":"**밀어붙여서 되긴 되는데 대가를 치른다.** 힘이 한쪽으로 몰려서 그렇다. 빡센데 결과는 나온다.","상형":"**예의 없는 일로 부딪친다.** 말 한마디, 태도 하나로 틀어진다. 일이 틀어지는 게 아니라 사람이 틀어지는 기라. 말조심이 약이다.","파":"**깨지진 않는데 금이 간다.** 뒷말, 질투, 재수 없는 일. 크게 안 터져서 넘기는데 은근히 오래 간다. 금 간 그릇 계속 쓰는 거랑 같다.","해":"**나는 안 맞는데 내 편이 맞는다.** 니가 손잡은 쪽을 옆에서 때린다. 직접 아픈 게 아니라 말도 못 하고, 그래서 더 거슬린다.","합":"**붙어서 안 떨어진다.** 묶이고 못 떠나는 대신 안정된다. 좋기만 한 건 아이다. 묶이면 못 움직인다."},"KIND_SHORT":{"충":"앞에서 말한 **통째로 갈리는** 그 일이다.","자형":"앞에서 말한 **제 발목 잡는** 그 버릇이다.","삼형":"앞에서 말한 **되긴 되는데 대가 치르는** 그 일이다.","상형":"앞에서 말한 **말 한마디로 틀어지는** 그 일이다.","파":"앞에서 말한 **금 간 그릇** 그 일이다.","해":"앞에서 말한 **내 편이 대신 맞는** 그 일이다.","합":"앞에서 말한 **붙어서 안 떨어지는** 그 일이다."},"LOVE_FIRST":{"reunion":"헤어졌는데 미련 남았다꼬? 그라모 이 편은 그 사람하고 다시 붙는 해가 있나다.","single":"혼자라꼬? 그라모 이 편은 어떤 사람이 올 건가다.","dating":"만나는 사람 있다꼬? 그라모 이 편은 그 사람이 니 짝 자리에 맞는 사람인가다.","married":"결혼했다꼬? 그라모 이 편은 옆에 있는 그 사람이 와 그런 사람인가다.","divorced":"갈라섰다꼬? 그라모 이 편은 와 그 사람이었고, 다음은 어떤 사람인가다.","unknown":"니 짝 얘기다."},"MARRIED_WORD":[["사람이 바뀌어도 그렇다.","몇 년을 같이 살아도 그렇다."]],"MISSING_G":{"비겁":"그라고 니 팔자엔 **니 편 들어줄 기운이 없다.** 그래서 니는 혼자 다 하려 든다. 시키는 걸 못 하고 맡기는 걸 못 한다. 없는 놈이 더 집착하는 법이다.","식상":"그라고 니 팔자엔 **만들어 내놓는 기운이 없다.** 근데 웃긴 게, 없으면 반대로 간다. 이런 사람이 말이 더 많다. 표현에 목말라서. 니 말 많은 거, 그거다.","재성":"그라고 니 팔자엔 **돈 기운이 없다.** 그래서 돈에 집착한다. 근데 이거 하나는 알아 둬라. 팔자에 없는 건 복이다. 없으니 잃을 것도 없다. 돈 얘기는 뒤에서 제대로 한다.","관성":"그라고 니 팔자엔 **니를 잡아 주는 울타리가 없다.** 그래서 소속에 집착한다. 어디 들어가고 싶고 인정받고 싶고. 근데 막상 들어가면 답답해서 못 견딘다. 혼자 일하는 사람이 명함 갖고 싶어 하는 거랑 같다.","인성":"그라고 니 팔자엔 **받쳐 주는 기운이 없다.** 그래서 배움에 집착한다. 자격증, 공부, 책. 근데 정작 받는 건 서툴다. 도와준다 캐도 됐다 카고 혼자 버틴다. 니가 피곤한 게 그래서다."},"MISSING_G_NONE":"그라고 다섯 기운이 다 있다. 없는 게 없으니 집착도 없다. 대신 딱 한 군데 미치지도 못한다. 뭘 해도 어중간하다는 소리 듣는 게 그래서다. 흠이 아니다. 고를 게 많은 기라.","MONEY_BIGEOP":"그라고 니 팔자엔 **니 같은 놈**이 {n}자다. 돈 고민이 평생 따라다니는 모양이다. 벌면 나눠지고 동업하면 샌다. 니 돈은 니 명의로, 니 통장에. 이거 하나만 지켜도 반은 막는다.","MONEY_CASE":{"순환":"니 팔자엔 **뭘 만드는 기운**이 {sik}자, **돈 기운**이 {jae}자, 둘 다 있다. 만들어서 담는 모양이다. 니가 만든 걸 돈으로 바꾸는 길이 뚫려 있단 말이다. 돈이 안 벌리면 만드는 걸 안 하고 있는 기라.","만들되못담음":"니 팔자엔 뭘 만드는 기운은 {sik}자인데 **돈 기운이 없다.** 만드는데 담을 그릇이 없는 기라. 재주는 많은데 돈이 안 남는 게 그래서다. 근데 잘 들어라. 팔자에 없는 건 복이다. 없으니 안 잃는다. 돈에 집착하면 그때 잃는다.","담되안만듦":"니 팔자엔 돈 기운은 {jae}자인데 **뭘 만드는 기운이 없다.** 그릇은 있는데 채울 게 없는 기라. 그래서 니 돈은 니가 만든 게 아니라 들어오는 돈이다. 월급, 가족, 아는 사람. 만들려고 애쓰지 마라. 니는 받아서 굴리는 사람이다.","둘다없음":"니 팔자엔 뭘 만드는 기운도 **돈 기운도 없다.** 그라모 돈이 없나? 아이다. 없는 건 복이다. 니는 돈 때문에 안 무너진다. 대신 니 돈은 손으로 오는 게 아니라 자리나 배움을 타고 온다. 돈 좇지 말고 자리를 잡아라."},"MONEY_FROM":{"월":"니 돈줄은 **일터**다. 월급이든 거래처든 손님이든, 일하는 데서 돈이 나온다. 일을 지키는 게 곧 돈을 지키는 기라.","일":"니 돈줄은 **니 살림과 짝**이다. 짝을 만나고 나서 돈이 붙거나, 둘이 같이 꾸리는 살림에서 돈이 모인다. 짝하고 사이가 좋을 때 돈도 좋다.","년":"니 돈줄은 **집안**이다. 부모나 집안에서 물려받거나 도움 받는 돈이 있다. 대신 그 돈은 집안 일에 다시 묶이기 쉽다.","시":"니 돈줄은 **늦게 열린다.** 젊을 때보다 마흔 넘어서, 말년으로 갈수록 돈이 붙는다. 자식이나 아랫사람 덕도 본다.","none":"니 팔자엔 돈 자리가 따로 없다. 그라모 니 돈은 어디서 오노? **니 재주나 니 자리를 타고 온다.** 돈을 좇으면 도망가고, 재주를 키우고 자리를 잡으면 따라온다."},"MONEY_FROM2":{"월":"일터","일":"살림과 짝","년":"집안","시":"말년"},"MONEY_FROM_MORE":" 그라고 {where} 쪽에서도 돈이 들어온다.","MONEY_KIND":{"편":"니 돈은 **통 큰 돈**이다. 월급으로는 성에 안 찬다. 만 원 아끼려고 걸어가면서 큰 계약엔 그 자리서 도장 찍는 사람. 크게 벌고 크게 쓴다. 남는 게 없으면 그래서다.","정":"니 돈은 **꼬박꼬박 버는 돈**이다. 월급, 자동이체. 한탕은 니 체질 아이다. 지루하게 쌓는 게 니 돈 버는 법이다. 남 대박 얘기에 흔들리면 잃는다.","혼":"니 돈은 통 큰 돈도 있고 꼬박꼬박 버는 돈도 있다. 꼬박꼬박도 하고 판도 벌인다. 둘 다 하니 바쁜데, 하나로 못 정해서 **둘 다 어중간할 때가 있다.**"},"MONEY_OUT":{"년":"새는 구멍은 형제와 집안이다. 집안에 일 생기면 니 돈이 먼저 나간다. 집안 돈하고 니 돈은 통장부터 갈라 둬라.","월":"새는 구멍은 동료와 동업자다. 같이 하자는 일, 같이 벌이자는 판에서 돈이 샌다. 일로 만난 사람하고 돈 섞지 마라.","일":"새는 구멍은 니 곁이다. 짝이나 제일 가까운 사람한테 쓰는 돈이 크다. 아까워하진 말되 한도는 정해 둬라.","시":"새는 구멍은 자식과 아랫사람이다. 챙겨 주는 돈이 생각보다 크다. 니 노후 몫은 먼저 떼고 챙겨라.","none":"크게 새는 구멍은 없다. 니가 판만 안 벌이면 돈은 모인다."},"MONEY_PATH":{"순환":"니가 만든 것","만들되못담음":"니 재주를 담아 줄 사람","담되안만듦":"남이 주는 것","둘다없음":"자리와 배움"},"MONEY_POS":{"stem_only":"돈 기운이 윗줄에만 있다. 윗줄은 생각이다. 돈 벌고 싶은 마음은 억수로 큰데 손에 쥔 건 적다. **생각이 앞서는 사람이다.**","branch_only":"돈 기운이 아랫줄에만 있다. 아랫줄은 살림이다. 돈 생각 안 해도 **돈이 붙어 있는 쪽**이다. 대신 굴릴 궁리를 안 한다.","both":"돈 기운이 윗줄에도 아랫줄에도 있다. 벌 궁리도 하고 실제로 쥔다. **판 벌여도 되는 사람이다.**"},"MONEY_PROXY":"돈 기운 없는 사람 처방은 하나다. **돈 관리할 사람을 옆에 둬라.** 없는 걸 니가 채우려 들면 부러진다. 돈 그릇 있는 사람 옆에 서라.","MONEY_STORY_HEAD":"니 돈 이야기를 하자. 돈도 자리가 있거든. 어느 자리에서 들어와서 어느 자리로 새는지 보면 니 돈 길이 보인다.","MONEY_TIMING":"집이든 큰 거든 사고팔 때는 이거 하나만 기억해라. **머리 맑은 해에 사고, 주머니 두둑한 해에 판다.** 머리 맑을 땐 잘 고르고, 주머니 두둑할 땐 아무거나 사거든. 뭘 벌이는 해에도 사지 마라. 똑같이 들뜬다. 니한텐 {buy}이 사는 해고 {sell}이 파는 해다.","MONEY_TIMING_NONE":"집이든 큰 거든 **머리 맑은 해에 사고, 주머니 두둑한 해에 판다.** 앞 6년 안엔 {what} 해가 없으니 그건 그때 다시 보자.","MOST":{"비겁":"니 팔자엔 **니랑 똑같은 놈**이 제일 많다({n}자). 한 반에 니랑 같은 과목 잘하는 애가 여럿인 기라. 남한테는 안 진다. 대신 평생 고민은 돈이다. 여럿이 나눠 먹으니까 벌어도 새고 벌어도 나눠진다.","식상":"니 팔자엔 **뭘 만들어 내놓는 기운**이 제일 많다({n}자). 가만있으면 좀이 쑤시는 사람이다. 말이든 손이든 뭘 내놔야 산다. 대신 평생 고민은 윗사람하고 조직이다. 니한텐 ⟪관가족⟫까지. 니가 내놓는 게 자꾸 그쪽 규칙하고 부딪친다.","재성":"니 팔자엔 **돈하고 사람 굴리는 기운**이 제일 많다({n}자). 어디 가도 이게 돈 되나부터 본다. 대신 평생 고민은 공부, 문서, 엄마 쪽이다. 굴리느라 배우는 걸 미루고, 그게 나중에 발목 잡는다.","관성":"니 팔자엔 **니를 누르는 기운**이 제일 많다({n}자). 어디 가도 결국 니한테 일이 맡겨진다. 대신 평생 고민은 니 자신이다. 남 기대에 맞추다 보니 정작 니가 뭘 원하는지를 모른다.","인성":"니 팔자엔 **받쳐 주는 기운**이 제일 많다({n}자). 책 사고 강의 듣는 게 편한 사람이다. 배우는 게 밥이다. 대신 평생 고민은 몸이 안 나가는 거다. 생각은 끝났는데 발이 안 떨어진다."},"NEW_ARRIVE":"하나 더. **{yy}년엔 니 팔자에 없던 {el} 기운이 온다.** 없던 손님이 오는 기라. 좋은 게 아니라 얼떨떨하다. 평생 운전 안 하던 사람한테 갑자기 차가 생긴 거랑 같다. 좋은데 무섭고 어디로 몰지 모른다. 적응할 시간을 줘라. 그해엔 큰 결정 하지 마라.","NEXT_G":{"재성":"**돈하고 일이 크게 움직이는 10년이다.** 벌이가 늘든 판이 커지든, 들어오고 나가는 돈의 크기가 달라진다. 이사, 일 바꾸기, 사업 같은 큰 움직임도 이때 많다. 그래서 움직이는 쪽이 맞다. 옮기든 차리든 넓히든 이 10년 안에 하는 게 좋다.","식상":"**하고 싶은 걸 꺼내서 해 보는 10년이다.** 새 일, 새 기술, 부업, 하고 싶은 말이 생긴다. 대신 윗사람이나 조직 규칙하고 자주 부딪친다. 그래서 작게 시작해서 키우는 쪽이 맞다. 처음부터 크게 걸면 덜 익은 채로 내놓게 된다.","관성":"**책임이 무거워지고 자리가 굳는 10년이다.** 직장이면 맡는 일과 직급이 늘고, 장사면 세금, 직원, 허가 같은 책임이 는다. 바쁘고 눌리는데 이름은 선다. 그래서 새로 벌이기보다 지금 자리를 키우는 쪽이 이득이다. 옮기더라도 하던 일로 더 나은 자리로 가라.","인성":"**배우고 실력을 쌓는 10년이다.** 공부, 자격, 집, 계약 같은 서류 일이 많고 도와주는 사람이 생긴다. 대신 몸이 무겁고 실행이 늦다. 그래서 달리기보다 실력과 자격을 쌓는 쪽이 맞다. 집 같은 큰 걸 사기엔 좋은 10년이다.","비겁":"**사람이 몰리고 경쟁이 붙는 10년이다.** 친구, 동료, 동업 얘기가 많아지고 돈이 사람 따라 나간다. 혼자 하던 걸 같이 하게 된다. 그래서 큰 결정보다 니 편을 만들고 실력을 다지는 쪽이 맞다. 동업하고 보증은 피해라."},"NEXT_INTRO":"다음 시즌은 **{ny}년**에 열린다. {narr}","NEXT_NONE":"니 시즌은 여기까지 보인다. 다음 시즌 얘기는 그때 다시 온나.","NOW_G":{"재성":"돈하고 일이 크게 움직이는 10년이다. 벌이가 늘든 판이 커지든, 들어오고 나가는 돈의 크기가 달라진다. 이사, 일 바꾸기, 사업 같은 큰 움직임도 이때 많다. 그래서 움직이는 쪽이 맞다. 옮기든 차리든 넓히든 이 10년 안에 하는 게 좋다.","식상":"하고 싶은 걸 꺼내서 해 보는 10년이다. 새 일, 새 기술, 부업, 하고 싶은 말이 생긴다. 대신 윗사람이나 조직 규칙하고 자주 부딪친다. 그래서 작게 시작해서 키우는 쪽이 맞다. 처음부터 크게 걸면 덜 익은 채로 내놓게 된다.","관성":"책임이 무거워지고 자리가 굳는 10년이다. 직장이면 맡는 일과 직급이 늘고, 장사면 세금, 직원, 허가 같은 책임이 는다. 바쁘고 눌리는데 이름은 선다. 그래서 새로 벌이기보다 지금 자리를 키우는 쪽이 이득이다. 옮기더라도 하던 일로 더 나은 자리로 가라.","인성":"배우고 실력을 쌓는 10년이다. 공부, 자격, 집, 계약 같은 서류 일이 많고 도와주는 사람이 생긴다. 대신 몸이 무겁고 실행이 늦다. 그래서 달리기보다 실력과 자격을 쌓는 쪽이 맞다. 집 같은 큰 걸 사기엔 좋은 10년이다.","비겁":"사람이 몰리고 경쟁이 붙는 10년이다. 친구, 동료, 동업 얘기가 많아지고 돈이 사람 따라 나간다. 혼자 하던 걸 같이 하게 된다. 그래서 큰 결정보다 니 편을 만들고 실력을 다지는 쪽이 맞다. 동업하고 보증은 피해라."},"NOW_GUNG":"그라고 이번 10년은 니 **{gung_mean}** 쪽을 건드린다. {kind_mean} 이 10년 동안 바뀌는 데가 여기다.","NOW_QUIET":"그라고 이 10년은 니 팔자를 크게 안 건드린다. 살던 대로 간다. 답답하면 니가 움직여야 된다.","OH_EXC":{"목":["나무가 많으면 자꾸 뻗으려고만 한다","일을 벌이고 넓히는데 마무리가 약하다","금","쇠는 가지를 쳐 준다. 벌인 것 중에 안 되는 걸 잘라 내는 힘이다"],"화":["불이 많으면 뜨겁게 타오른다","말하고 움직이는 속도가 앞서서 사람하고 부딪치고 몸이 먼저 지친다","수","물은 불을 식혀 준다. 한 박자 쉬고 생각하는 힘이다"],"토":["흙이 많으면 굳는다","자기 기준이 세지고 고집이 생기고, 새로 뭘 키우는 힘이 줄어든다","목","나무는 굳은 흙을 뚫어 준다. 새로 배우고 새 사람 만나는 힘이다"],"금":["쇠가 많으면 날카롭고 차갑다","맞다 틀리다를 따지느라 사람이 멀어진다","화","불은 쇠를 녹여 쓸모 있는 모양으로 만든다. 사람 앞에 서서 부딪쳐 보는 힘이다"],"수":["물이 많으면 넘치고 흩어진다","생각과 걱정이 많아 방향 없이 흘러간다","토","흙은 둑이 되어 물길을 잡아 준다. 마감, 규칙, 정해진 틀이다"]},"OH_EXC_HAS":" 니 팔자엔 그게 있어서 넘쳐도 선은 지킨다.","OH_EXC_NONE":" 근데 니 팔자엔 그게 없다. 그래서 한번 넘치면 브레이크가 없다. {ri} 들어오는 해에 균형이 잡힌다.","OH_EXC_TPL":"제일 많은 건 {named} {phys}. 사는 데서는 {life}. 이걸 잡아 주는 게 {rnamed} {rphys}.{has}","OH_FLOW_ALL":"그라고 니 팔자는 다섯 기운이 빙 돌아 이어진다. 시작에서 열매까지 막히는 데가 없다. 대신 어디 한 군데 크게 몰리지도 않아서, 니가 힘줄 데를 골라야 된다.","OH_FLOW_BROKEN":"그라고 기운이 이어지는 길을 보면 {links}이 끊겨 있다. 니가 자꾸 같은 데서 막히는 자리가 바로 거기다.","OH_HAS":{"봄":" 니 팔자엔 그 불이 있다. 벌인 게 꽃까지는 핀다.","여름":" 니 팔자엔 그 물이 있다. 달아올라도 한 번 식혀 갈 줄 안다.","가을":" 니 팔자엔 그 불이 있다. 단단한 니 기준이 쓸모 있는 실력으로 다듬어진다.","겨울":" 니 팔자엔 그 불이 있다. 얼어붙지 않고 움직일 힘이 있다."},"OH_HEAD":"니 기운이 우째 짜였는지 보자. 글자가 있냐 없냐보다, 니가 태어난 계절에 맞는지, 기운이 끊기지 않고 이어지는지가 더 중요하거든.","OH_LINK":{"0":"나무에서 불로 가는 길, 그러니까 하고 싶은 걸 밖으로 드러내는 길","1":"불에서 흙으로 가는 길, 드러낸 걸 쌓아서 신용이나 자리로 붙드는 길","2":"흙에서 쇠로 가는 길, 쌓은 걸 결과물로 딱 굳히는 길","3":"쇠에서 물로 가는 길, 거둔 걸 여유나 지혜로 돌리는 길","4":"물에서 나무로 가는 길, 생각을 새 시작으로 옮기는 길"},"OH_NEED":{"봄":"화","여름":"수","가을":"화","겨울":"화"},"OH_NONE":{"봄":" 근데 니 팔자엔 그 불이 없다. 시작은 많은데 꽃까지 못 가고 흐지부지되기 쉽다. 불 기운이 들어오는 해에 일이 피는 게 그래서다.","여름":" 근데 니 팔자엔 그 물이 없다. 한번 달아오르면 식힐 줄을 몰라 몸이 먼저 지친다. 물 기운이 들어오는 해에 숨이 트이는 게 그래서다.","가을":" 근데 니 팔자엔 그 불이 없다. 단단하긴 한데 쓰임을 못 찾고 고집으로 굳기 쉽다. 불 기운이 들어오는 해에 니가 빛을 보는 게 그래서다.","겨울":" 근데 니 팔자엔 그 불이 없다. 움츠러들고 시작이 늦다. 불 기운이 들어오는 해에 몸이 풀리고 일이 움직이는 게 그래서다."},"OH_SEASON":{"봄":"니는 봄에 태어났다. 봄은 나무 기운이 막 올라오는 때라, 햇볕 같은 불이 있어야 꽃이 피고 열매로 간다.","여름":"니는 여름에 태어났다. 여름 땅은 뜨겁고 메말라서, 물이 있어야 타지 않고 버틴다.","가을":"니는 가을에 태어났다. 가을은 쇠 기운이 단단해지는 때라, 불이 있어야 그 쇠를 다듬어 쓸모 있는 모양을 만든다.","겨울":"니는 겨울에 태어났다. 겨울 땅은 얼어 있어서, 불이 있어야 녹아서 뭘 키울 수 있다."},"ORDER":{"true":"니 10년 시즌은 **계절 순서대로** 간다. 순리대로 가는 사람이다. 무리하면 진다.","false":"니 10년 시즌은 **계절을 거꾸로** 간다. 도전하고 뒤집는 사람이다. 순리대로만 살면 답답해서 병난다. 거꾸로 가는 게 나쁜 거 아이다. 니 길이 그쪽인 기라."},"OVER":{"비겁":["사람을 가려라","니 같은 기운이 넘치니 같이 하자는 사람이 늘 붙는다. 같이 하자는 말은 반은 거절해라. 동업하고 보증은 아예 하지 마라."],"식상":["벌인 걸 줄여라","만들어 내놓는 기운이 넘치니 늘 일을 벌인다. 벌인 것 중 하나는 접어라. 하나를 끝까지 하는 게 열 개 벌이는 것보다 낫다."],"재성":["판은 한 번에 하나만 벌여라","돈 굴리는 기운이 넘치니 욕심이 앞선다. 한 판이 끝나기 전에 다음 판에 손대지 마라."],"관성":["책임 하나를 내려놔라","누르는 기운이 넘치니 늘 무거운 걸 지고 산다. 니가 안 해도 되는 일 하나를 남한테 넘겨라. 거절도 일이다."],"인성":["생각했으면 사흘 안에 시작해라","받쳐 주는 기운이 넘치니 생각만 하다 날 샌다. 정한 건 사흘 안에 손대라. 완벽하게 준비되는 날은 안 온다."]},"PAIR_STORY":{"월,일":{"title":"일하고 집이 서로 발목을 잡는다","scene":"일이 잘 풀리면 집이 비고, 집을 챙기면 일이 밀린다. 바쁠 때 짝이 서운해하고, 짝 챙기다 보면 일에서 기회를 놓친다. 둘 다 잘하려다 둘 다 지치는 게 니 모양이다.","block":"일하는 시간하고 집 시간을 달력에 갈라 놔라. 큰일 앞두고는 짝한테 먼저 말해 두고 시작해라."},"년,월":{"title":"집안 일이 니 일을 흔든다","scene":"니 일이 좀 풀릴 만하면 집안에 일이 터진다. 부모 일, 형제 일, 집안 돈 문제. 니가 나서서 수습하다 보면 니 일이 밀린다.","block":"집안 일은 니 혼자 다 떠안지 마라. 형제하고 나눠라. 돈은 니 몫하고 집안 몫을 통장부터 갈라 둬라."},"년,일":{"title":"집안하고 니 짝이 부딪친다","scene":"부모나 집안 어른하고 니 짝 사이에 니가 끼어 있다. 이쪽 편 들면 저쪽이 서운하고, 명절마다 속이 시끄럽다.","block":"집안 얘기는 니가 직접 전하지 말고 니 선에서 걸러라. 짝 편을 먼저 들어 주는 게 결국 집안도 지킨다."},"월,시":{"title":"일하고 자식이 서로 끌어당긴다","scene":"일에 몰두하면 자식이나 아랫사람 일이 터지고, 그쪽 챙기면 일이 밀린다. 니가 키운 사람이 니 일을 흔들기도 한다.","block":"아랫사람한테 맡길 거는 확실히 맡기고, 자식하고는 정해진 시간을 지켜라."},"일,시":{"title":"짝하고 자식 사이에서 니가 끼인다","scene":"짝하고 자식 사이가 니 손을 거쳐야 굴러간다. 자식 문제로 부부가 부딪치고, 니 노후 계획이 자식 일로 자꾸 바뀐다.","block":"자식 일은 짝하고 먼저 한목소리를 내라. 니 노후 몫은 따로 떼어 둬라."},"년,시":{"title":"윗대하고 아랫대 사이에 니가 낀다","scene":"부모도 챙겨야 하고 자식도 챙겨야 한다. 위아래로 돈이 나가고 니 몫이 안 남는다.","block":"위아래로 나가는 돈에 한도를 정해라. 니 몫을 먼저 떼고 남는 걸로 챙겨라."}},"PARENT_AMT":{"0":"부모한테 크게 받을 팔자는 아니다. 니 돈은 니가 만드는 쪽이다. 서운해할 거 없다. 받을 게 적은 만큼 짐도 적다.","1":"부모 덕은 **조금 있다.** 목돈이 필요할 때 보탬이 되는 정도다. 이사나 결혼 같은 큰일에 한 번 손 벌릴 데가 있다는 소리다.","2":"부모 덕이 **꽤 있다.** 전세금이나 집 마련처럼 큰돈에 실제로 보탬이 되는 정도다.","3":"부모 덕이 **큰 편이다.** 집이나 땅 같은 재산이 니 쪽으로 넘어올 수 있는 팔자다."},"PARENT_HEAD":"부모한테 받을 게 있나도 보자. 태어난 해하고 태어난 달 자리가 집안과 부모 자리다. 거기 돈 기운이나 받쳐 주는 기운이 앉아 있으면 받을 게 있는 기라.","PARENT_KIND":{"in":" 받는 모양은 현금보다 집이나 서류다. 명의, 증여, 보증 같은 걸로 온다.","jae":" 받는 모양은 현금이다. 사업 밑천이나 목돈으로 온다.","both":" 현금도 집이나 서류도 둘 다 올 수 있다."},"PARENT_SHARE":" 근데 그 자리에 형제 기운도 같이 앉아 있다. 형제하고 나눠 가질 몫이니 미리 말을 맞춰 둬라.","PARENT_WHEN":" 시기로 보면 {yrs}년에 부모 쪽 돈이나 문서가 움직이기 쉽다.","PARENT_WHEN_DW":" 시기로 보면 지금 10년({y1}년부터 {y2}년까지) 안에 그런 일이 생기기 쉽다.","PARENT_WHEN_NONE":" 앞 10년 안엔 크게 움직이는 해가 안 보인다. 받을 게 있어도 늦게 온다.","PAST_AGAIN_EV":{"good":"앞 10년에 잡은 게 이때 더 커졌을 기라. 자리든 돈이든 한 단계 올라섰다.","hard":"앞 10년 고생이 이때도 이어졌을 기라. 같은 데서 또 넘어지는 느낌이었제."},"PAST_CMP":{"better":"앞 10년보다 확실히 나았다.","worse":"앞 10년보다 버거웠다.","same":"앞 10년하고 비슷한 결로 갔다."},"PAST_EV":{"재성":{"good":"돈이 붙던 때다. 벌이가 늘었거나, 장사나 투자로 재미를 봤거나, 큰 걸 하나 장만했을 기라.","hard":"돈 때문에 애먹은 때다. 벌려고 판을 키웠다가 손해를 봤거나, 들어온 만큼 나갔을 기라. 아버지나 집안 돈 문제가 걸렸을 수도 있다."},"식상":{"good":"니 재주가 빛을 본 때다. 새 일을 시작했거나 니가 만든 게 인정받았을 기라. 자식이 생긴 때일 수도 있다.","hard":"참던 게 터진 때다. 윗사람하고 부딪쳐서 그만뒀거나, 벌인 일이 생각만큼 안 됐을 기라."},"관성":{"good":"자리가 생긴 때다. 소속이 생기거나 맡는 일이 커지거나, 결혼처럼 이름이 붙는 일이 있었을 기라.","hard":"눌리고 버틴 때다. 일이 버겁고 윗사람 등쌀에 시달렸거나, 몸이 고생했을 기라."},"인성":{"good":"배우고 도움 받은 때다. 자격을 땄거나, 집이나 계약 같은 서류가 들어왔거나, 끌어 주는 사람을 만났을 기라.","hard":"생각만 많고 몸이 안 나간 때다. 공부는 했는데 써먹을 데가 없었거나, 기회를 미루다 놓쳤을 기라."},"비겁":{"good":"사람 덕을 본 때다. 친구나 동료하고 같이 해서 일이 됐고, 니 편이 생겼을 기라.","hard":"사람 때문에 손해 본 때다. 동업이나 빌려준 돈이 탈 났거나, 형제나 친구하고 돈 문제로 틀어졌을 기라."}},"PAST_EV_OLD":{"관성":{"good":"책임 자리를 맡은 때다. 직함이 오르거나 맡는 일이 커졌을 기라.","hard":"눌리고 버틴 때다. 일이 버겁고 윗사람 등쌀에 시달렸거나, 몸이 고생했을 기라."},"식상":{"good":"니 손재주, 말재주가 다시 빛을 본 때다. 배운 걸 남한테 가르치거나 새 일을 벌였을 기라.","hard":"참던 게 터진 때다. 윗사람하고 부딪쳐서 그만뒀거나, 벌인 일이 생각만큼 안 됐을 기라."}},"PAST_EV_YOUNG":{"식상":{"good":"니 재주가 빛을 본 때다. 공부든 알바든 니가 해 놓은 게 인정받았을 기라.","hard":"하고 싶은 게 많아서 부딪친 때다. 학교나 첫 일터 규칙이 답답했을 기라."},"관성":{"good":"소속이 생긴 때다. 학교나 첫 직장에 자리를 잡았을 기라.","hard":"규칙하고 시험에 눌린 때다. 버티느라 욕봤을 기라."},"재성":{"good":"일찍 돈맛을 본 때다. 알바나 첫 벌이로 니 돈이 생겼을 기라.","hard":"돈 때문에 일찍 철든 때다. 집안 형편이나 첫 벌이 때문에 애먹었을 기라."}},"PAST_FIT":{"good":"그 기운이 니 힘하고 맞아서 애쓴 만큼 남았다.","hard":"근데 그 기운이 니한테 버거워서 애쓴 만큼 안 남았다.","lgood":"크게 튀진 않아도 니 편이 반은 됐다.","lhard":"니 편이 반도 안 돼서 애쓴 거에 비해 남는 게 적었다."},"PAST_FRAME":"**{y1}년부터 {y2}년까지** ({age1}세에서 {age2}세). {narr}","PAST_G":{"비겁":"니 같은 놈들 사이에서 부대낀 10년이다. 친구, 동료, 경쟁자. 사람은 많았는데 돈은 나눠졌제. 그때 고민은 돈이었을 기라. 맞제?","식상":"만들고 말하고 벌인 10년이다. 하고 싶은 게 많았고 실제로 벌였고, 윗사람하고 부딪쳤다. 그때 고민은 직장이나 ⟪관가족⟫이었다.","재성":"돈이 움직인 10년이다. 벌었든 잃었든 판이 컸다. 달리느라 바빴고, 그만큼 공부며 문서며 엄마 쪽은 뒷전이었제.","관성":"책임이 얹힌 10년이다. 자리가 생기고 이름이 생기고 그만큼 눌렸다. 그때 고민은 니 자신이었다. 내가 뭘 원하는지 모르겠는 거.","인성":"받고 배운 10년이다. 자격, 문서, 도와주는 사람. 대신 몸이 안 움직였다. 생각만 많고 손이 안 나갔제."},"PAST_GUNG":"그 10년엔 니 **{gung_mean}** 쪽이 흔들렸다.","PAST_G_AGAIN":{"비겁":"또 니 같은 놈들 시즌이다. 같은 모양이 20년 간 기라. 사람 속에서 부대끼고 돈은 나눠지고. 지겨웠으면 그래서다.","식상":"또 만들고 벌이는 시즌이다. 20년 내내 만들고 벌였단 말이다. 재주는 늘었는데 윗사람하고는 계속 부딪쳤제.","재성":"또 달리는 시즌이다. 20년을 달렸단 말이다. 돈은 움직였는데 공부며 엄마 쪽은 계속 뒷전이었제.","관성":"또 책임지는 시즌이다. 20년 내내 책임졌단 말이다. 자리는 굳었는데 니가 뭘 원하는지는 점점 흐려졌제.","인성":"또 배우는 시즌이다. 20년을 받고 배웠단 말이다. 머리는 찼는데 손이 안 나갔제. 움직일 때 놓친 느낌, 그거다."},"PAST_HEAD":"**{y1}년부터 {y2}년까지, {age1}세에서 {age2}세는 {verdict}.**","PAST_MIND":{"재성":" 속으로는 돈 생각이 꽉 차 있었다.","식상":" 속으로는 하고 싶은 게 많았다.","관성":" 속으로는 책임감에 눌려 있었다.","인성":" 속으로는 배우고 싶고 기대고 싶었다.","비겁":" 속으로는 남한테 지기 싫었다."},"PAST_MIX":" 근데 다 좋지는 않았다. ","PAST_QUIET":"그 10년은 니 팔자를 크게 안 건드렸다. 살던 대로 산 10년이다. 지루했으면 그래서다.","PAST_SAME":"앞 10년하고 같은 기운이 이어진 때다. ","PAST_SEAT":{"월":{"충":"그라고 그 10년 사이에 하던 일이 크게 바뀌었을 기라. 일자리를 옮기거나 그만두거나, 이사나 부모님 일 중에 하나는 있었다.","합":"그라고 그 10년엔 한 직장, 한 일에 오래 묶여 있었을 기라. 떠나고 싶어도 못 떠났제.","etc":"그라고 그 10년엔 일하는 데서 자잘한 말썽이 끊이지 않았을 기라."},"일":{"충":"그라고 그 10년 사이에 연애나 결혼에 큰 변화가 있었거나, 이사, 몸 고생이 있었을 기라.","합":"그라고 그 10년엔 짝이 생기거나 결혼처럼 사람하고 묶이는 일이 있었을 기라.","etc":"그라고 그 10년엔 옆 사람하고 자잘하게 부딪치는 일이 잦았을 기라."},"년":{"충":"그라고 집안 어른 쪽에 일이 있었거나 고향을 떠났을 기라.","합":"그라고 집안 도움을 받은 일이 있었을 기라.","etc":"그라고 집안에 말이 많았을 기라."},"시":{"충":"그라고 자식이나 아랫사람 일로 속 썩은 일이 있었을 기라.","합":"그라고 자식이 생기거나 아랫사람 덕을 본 일이 있었을 기라.","etc":"그라고 자식이나 아랫사람 일로 신경 쓸 일이 잦았을 기라."}},"PAST_SEAT_M":{"월":{"충":"그라고 그 10년 사이에 하던 일이 크게 바뀌었을 기라. 일자리를 옮기거나 그만두거나, 이사나 부모님 일 중에 하나는 있었다.","합":"그라고 그 10년엔 한 직장, 한 일에 오래 묶여 있었을 기라. 떠나고 싶어도 못 떠났제.","etc":"그라고 그 10년엔 일하는 데서 자잘한 말썽이 끊이지 않았을 기라."},"일":{"충":"그라고 그 10년 사이에 결혼이나 부부 사이에 큰 변화가 있었거나, 이사, 몸 고생이 있었을 기라.","합":"그라고 그 10년엔 결혼처럼 짝하고 단단히 묶이는 일이 있었을 기라.","etc":"그라고 그 10년엔 옆 사람하고 자잘하게 부딪치는 일이 잦았을 기라."},"년":{"충":"그라고 집안 어른 쪽에 일이 있었거나 고향을 떠났을 기라.","합":"그라고 집안 도움을 받은 일이 있었을 기라.","etc":"그라고 집안에 말이 많았을 기라."},"시":{"충":"그라고 자식이나 아랫사람 일로 속 썩은 일이 있었을 기라.","합":"그라고 자식이 생기거나 아랫사람 덕을 본 일이 있었을 기라.","etc":"그라고 자식이나 아랫사람 일로 신경 쓸 일이 잦았을 기라."}},"PAST_VERDICT":{"good":"잘 풀린 10년이다","hard":"힘들었던 10년이다","mixed":"좋은 것도 힘든 것도 섞인 10년이다","lgood":"고생은 해도 결과는 괜찮았던 10년이다","lhard":"마음은 앞섰는데 결과가 안 따라온 10년이다"},"PAST_WHY":{"good":"그 10년 기운이 니 타고난 힘하고 맞았거든. 힘을 쓰는 만큼 결과가 나왔다.","hard":"그 10년 기운이 니한테 버거웠거든. 애쓴 만큼 안 나오고 몸하고 마음이 먼저
