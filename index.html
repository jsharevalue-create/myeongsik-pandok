<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--serif:"Noto Serif KR","AppleMyungjo",serif;--sans:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --bg:#f4efe4;--paper:#fbf8f1;--ink:#2b2622;--ink2:#6a6157;--line:#d9cfbd;--acc:#8c2f22;--accs:#f1e2d8;--judge:#ece6da;--warn:#a2461f;
  --e0:#3f6b3a;--e1:#a33b25;--e2:#8a6a2c;--e3:#6b6b73;--e4:#2c4f7a}
body[data-d="B"]{--bg:#ffffff;--paper:#f6f8fb;--ink:#1d2a44;--ink2:#5b6680;--line:#d6dce8;--acc:#0f7c7a;--accs:#e1f2f1;--judge:#eef1f6;--warn:#b5562a}
body[data-d="C"]{--bg:#f2f2ef;--paper:#ffffff;--ink:#2e3230;--ink2:#666b67;--line:#d5d8d3;--acc:#2f6b4f;--accs:#e2efe7;--judge:#f0f1ee;--warn:#9a5b1f}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body{--bg:#1b1a18;--paper:#252321;--ink:#ece6da;--ink2:#b2a998;--line:#3d3833;--accs:#3a2a25;--judge:#2c2926;--e0:#8fbf86;--e1:#f08a72;--e2:#d6b06a;--e3:#b8b8c2;--e4:#8fb3e6;--acc:#e59b84;--warn:#f0a07a;color-scheme:dark}
  :root:not([data-theme="light"]) body[data-d="B"]{--acc:#5fd0cc;--accs:#163a39} :root:not([data-theme="light"]) body[data-d="C"]{--acc:#7cc79f;--accs:#1e3a2c}}
:root[data-theme="dark"] body{--bg:#1b1a18;--paper:#252321;--ink:#ece6da;--ink2:#b2a998;--line:#3d3833;--accs:#3a2a25;--judge:#2c2926;--e0:#8fbf86;--e1:#f08a72;--e2:#d6b06a;--e3:#b8b8c2;--e4:#8fb3e6;--acc:#e59b84;--warn:#f0a07a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
.top{max-width:1180px;margin:0 auto;padding-top:18px}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sw .t{font-family:var(--serif);font-weight:700;font-size:20px;margin-right:12px}
.sw button,.cust{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:20px;padding:6px 14px;cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.cust{margin-left:auto} .cust[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
form{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink2)}
form label{display:flex;flex-direction:column;gap:2px} form input,form select{font:inherit;font-size:14px;width:74px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
form .chk{flex-direction:row;align-items:center;gap:4px;color:var(--ink)} form .chk input{width:auto}
form button{font:inherit;font-weight:700;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer}
#app{max-width:1180px;margin:14px auto 0}
.han{font-family:var(--serif);font-weight:700}
.e0{color:var(--e0)}.e1{color:var(--e1)}.e2{color:var(--e2)}.e3{color:var(--e3)}.e4{color:var(--e4)}
.judge{background:var(--judge);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--ink2);white-space:pre-wrap;overflow-x:auto;line-height:1.6;margin:0 0 8px}
.read{font-family:var(--serif);font-size:16px;line-height:1.9}
.read p{margin:0 0 7px} .lab{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;color:var(--acc);min-width:64px;letter-spacing:.04em}
body.cust .judge{display:none} body.cust .read{font-size:20px}
.mjt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;max-width:420px}
.mjt .col{display:flex;flex-direction:column;gap:4px} .mjt .gh{text-align:center;font-size:11px;color:var(--ink2)}
.mjt .cell{background:var(--paper);border:1px solid var(--line);border-radius:8px;text-align:center;padding:3px 2px}
.mjt .cell .h{font-size:28px;line-height:1.15} .mjt .cell .s{font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mjt .cell.me{background:var(--accs);border-color:var(--acc)}
.seat{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px dashed var(--line)} .seat:first-child{border-top:0}
.seat .k{text-align:center;font-size:11px;color:var(--ink2)} .seat .k .han{display:block;font-size:24px;line-height:1.2}
.yr{border-top:1px dashed var(--line);padding:10px 0} .yr:first-child{border-top:0}
.yr h4{margin:0 0 4px;font-size:15px} .yr.warn h4{color:var(--warn)} .yr .todo{font-family:var(--sans);font-size:14px;font-weight:700;color:var(--acc)}
.mind{border:2px solid var(--acc);border-radius:12px;padding:14px 18px;background:var(--paper)}
.refs{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--ink2);max-width:760px}
.refs h3{font-family:var(--serif);font-size:16px;color:var(--ink);margin:0 0 8px} .refs p{margin:6px 0} .refs p b{color:var(--ink);margin-right:8px;font-weight:600}
.refs details{margin-top:8px} .refs summary{cursor:pointer;color:var(--acc)} .refs ul{margin:6px 0 0;padding-left:20px} .refs li{margin:3px 0;overflow-wrap:anywhere}
.mind ol{margin:0;padding-left:22px;font-family:var(--serif);font-size:17px} .mind li{margin:8px 0} .mind li b{display:block} .mind li span{color:var(--ink2);font-size:15px}
/* A 두루마리 */
.A .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.A .catnav{display:flex;gap:6px;flex-wrap:wrap} .A .catnav a{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:18px;padding:4px 14px;background:var(--paper)}
.A .info{font-size:12px;color:var(--ink2);flex-basis:100%}
.A .cat{margin-top:30px;scroll-margin-top:170px} .A .cat>h2{font-family:var(--serif);font-size:26px;margin:0 0 4px;border-bottom:2px solid var(--acc);display:inline-block;padding-right:20px}
.A .item{margin-top:18px} .A .item h3{font-family:var(--serif);font-size:18px;margin:0 0 6px} .A .item h3 small{font-family:var(--sans);font-size:11px;color:var(--ink2);font-weight:400;margin-left:8px}
.A .box{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:12px 16px}
.A .wrapA{max-width:820px} .A .bar .mjt{width:320px;max-width:100%}
/* B 명식 지도 */
.B .map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.B .board{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:10px;position:sticky;top:10px}
.B .quad{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.B .quad h3{margin:0 0 6px;font-family:var(--serif);font-size:20px;color:var(--acc)}
.B .quad button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:none;border:0;border-left:3px solid transparent;color:var(--ink);padding:4px 8px;cursor:pointer;border-radius:4px}
.B .quad button[aria-current="true"]{border-left-color:var(--acc);background:var(--accs);font-weight:700}
.B .center{grid-column:1 / -1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px}
.B .center .info{font-size:12px;color:var(--ink2)}
.B .pane{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 20px;min-height:400px}
.B .pane h2{font-family:var(--serif);font-size:22px;margin:0 0 2px} .B .pane .sub{font-size:12px;color:var(--ink2);margin-bottom:12px}
.B .next{display:flex;justify-content:space-between;margin-top:14px} .B .next button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
/* C 상담 책상 */
.C .head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.C .head .mjt{width:300px;max-width:100%} .C .head .mjt .cell .h{font-size:20px} .C .head .info{font-size:12px;color:var(--ink2)}
.C .tabs{display:flex;gap:4px;margin-top:14px;border-bottom:2px solid var(--line)}
.C .tabs button{font:inherit;font-family:var(--serif);font-size:18px;font-weight:700;background:none;border:0;padding:8px 22px;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.C .tabs button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
.C .desk{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1.3fr);gap:14px;margin-top:14px;align-items:start}
.C .list button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;color:var(--ink);cursor:pointer}
.C .list button[aria-current="true"]{border-color:var(--acc);background:var(--accs);font-weight:700}
.C .colh{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.06em;margin-bottom:6px}
.C .rd{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.C .strip{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px} .C .strip button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:4px 9px;cursor:pointer}
.C .strip button[aria-current="true"]{background:var(--acc);color:#fff;border-color:var(--acc)} .C .strip button.w{border-color:var(--warn)}
body.cust .C .desk{grid-template-columns:200px minmax(0,1fr)} body.cust .C .jcol{display:none}
body.cust .B .map{grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr)}
@media (max-width:820px){ .B .map,.C .desk{grid-template-columns:1fr} .B .board{position:static} .C .list{display:flex;gap:6px;overflow-x:auto} .C .list button{white-space:nowrap;width:auto} }
@media (max-width:480px){ .mjt .cell .h{font-size:22px} .A .cat>h2{font-size:22px} }
.note{font-size:12px;color:var(--ink2);margin-top:26px}
</style>

<div class="top">
  <div class="sw"><span class="t">판독 디자인 미리보기</span>
    <button data-v="A" aria-pressed="true">A 두루마리</button><button data-v="B" aria-pressed="false">B 명식 지도</button><button data-v="C" aria-pressed="false">C 상담 책상</button>

  <form id="f">

  </form>
</div>
<div id="app"></div>
<p class="note top">기본값은 가상의 생년월일입니다. 입력은 이 화면 안에서만 계산되고 저장·전송되지 않습니다. 숫자 가중치는 정본의 설계값입니다.</p>

<script>
(function(){
